&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main&gt;&lt;h1&gt;Tipos de verbos&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;Clasificación según la función que desempeñan en la oración&lt;/p&gt;&lt;section class=&quot;tree&quot; id=&quot;inicio&quot;&gt;&lt;button class=&quot;root&quot; id=&quot;raiz&quot;&gt;&lt;strong&gt;TIPOS DE VERBOS&lt;/strong&gt;&lt;small&gt;Un mismo verbo puede cumplir distintas funciones · Pulsa para saber más&lt;/small&gt;&lt;/button&gt;&lt;svg class=&quot;connector&quot; viewBox=&quot;0 0 1000 90&quot; preserveAspectRatio=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M500 0 V43 M125 43 H875 M125 43 V90 M375 43 V90 M625 43 V90 M875 43 V90&quot;/&gt;&lt;/svg&gt;&lt;div class=&quot;nodes&quot;&gt;&lt;button class=&quot;node&quot; data-key=&quot;voll&quot; aria-pressed=&quot;false&quot; style=&quot;--border:#2585b5;--dark:#12618d;--tint:#eaf7fc&quot;&gt;&lt;strong&gt;Vollverben&lt;/strong&gt;&lt;span class=&quot;hint&quot;&gt;Expresan una acción o estado&lt;/span&gt;&lt;em&gt;Ich schlafe.&lt;/em&gt;&lt;/button&gt;&lt;button class=&quot;node&quot; data-key=&quot;hilfs&quot; aria-pressed=&quot;false&quot; style=&quot;--border:#d79534;--dark:#8b5811;--tint:#fff7e8&quot;&gt;&lt;strong&gt;Hilfsverben&lt;/strong&gt;&lt;span class=&quot;hint&quot;&gt;Auxiliar + forma verbal&lt;/span&gt;&lt;em&gt;Ich habe gelernt.&lt;/em&gt;&lt;/button&gt;&lt;button class=&quot;node&quot; data-key=&quot;modal&quot; aria-pressed=&quot;false&quot; style=&quot;--border:#8a6dc5;--dark:#62469b;--tint:#f4efff&quot;&gt;&lt;strong&gt;Modalverben&lt;/strong&gt;&lt;span class=&quot;hint&quot;&gt;Modal + infinitivo&lt;/span&gt;&lt;em&gt;Ich muss lernen.&lt;/em&gt;&lt;/button&gt;&lt;button class=&quot;node&quot; data-key=&quot;kopula&quot; aria-pressed=&quot;false&quot; style=&quot;--border:#369a77;--dark:#197252;--tint:#e9f8f0&quot;&gt;&lt;strong&gt;Kopulaverben&lt;/strong&gt;&lt;span class=&quot;hint&quot;&gt;Sujeto + verbo + atributo&lt;/span&gt;&lt;em&gt;Ich werde müde.&lt;/em&gt;&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;p class=&quot;tip&quot;&gt;Pulsa el nodo central o cualquiera de las cuatro clases para ampliar la información debajo.&lt;/p&gt;&lt;section class=&quot;detail&quot; id=&quot;detalle&quot; aria-live=&quot;polite&quot;&gt;&lt;h2 id=&quot;titulo&quot;&gt;&lt;/h2&gt;&lt;div id=&quot;contenido&quot;&gt;&lt;/div&gt;&lt;button class=&quot;back&quot; id=&quot;volver&quot;&gt;↩ Regresar a la infografía&lt;/button&gt;&lt;/section&gt;&lt;/main&gt;&lt;script&gt;
const D={general:{title:'Tipos de verbos — visión general',body:`&lt;p&gt;Esta clasificación distingue los verbos por &lt;b&gt;la función que cumplen en una oración&lt;/b&gt;, no por su terminación o su conjugación.&lt;/p&gt;&lt;h3&gt;Cuatro funciones principales&lt;/h3&gt;&lt;p&gt;&lt;b&gt;Vollverben:&lt;/b&gt; aportan significado léxico. &lt;b&gt;Hilfsverben:&lt;/b&gt; construyen tiempos compuestos y la pasiva. &lt;b&gt;Modalverben:&lt;/b&gt; expresan capacidad, necesidad, permiso o voluntad. &lt;b&gt;Kopulaverben:&lt;/b&gt; relacionan el sujeto con una cualidad o identidad.&lt;/p&gt;&lt;h3&gt;Importante: las clases pueden coincidir&lt;/h3&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er wird müde.&lt;/b&gt; — Se está cansando. → &lt;i&gt;werden&lt;/i&gt; es copulativo.&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er wird lernen.&lt;/b&gt; — Estudiará. → &lt;i&gt;werden&lt;/i&gt; es auxiliar.&lt;/div&gt;&lt;p&gt;Por eso, para clasificar un verbo, observa &lt;b&gt;cómo se usa en esa oración&lt;/b&gt;.&lt;/p&gt;`},voll:{title:'Vollverben — verbos plenos',body:`&lt;h3&gt;¿Para qué se usan?&lt;/h3&gt;&lt;p&gt;Expresan por sí mismos una acción, un proceso o un estado. Son los verbos que aportan el significado principal de lo que ocurre.&lt;/p&gt;&lt;h3&gt;¿Cómo se reconocen?&lt;/h3&gt;&lt;p&gt;En una oración simple, el verbo pleno puede aparecer conjugado sin necesitar un auxiliar.&lt;/p&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich schlafe.&lt;/b&gt; — Duermo.&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Sie liest ein Buch.&lt;/b&gt; — Ella lee un libro.&lt;/div&gt;&lt;h3&gt;Relación con los auxiliares&lt;/h3&gt;&lt;p&gt;El mismo verbo pleno puede combinarse con &lt;i&gt;haben&lt;/i&gt; o &lt;i&gt;sein&lt;/i&gt; para formar el Perfekt.&lt;/p&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich habe geschlafen.&lt;/b&gt; — He dormido.&lt;/div&gt;`},hilfs:{title:'Hilfsverben — verbos auxiliares',body:`&lt;h3&gt;¿Cuáles son?&lt;/h3&gt;&lt;p&gt;&lt;b&gt;haben, sein y werden.&lt;/b&gt; Se utilizan para construir formas verbales junto con otro verbo.&lt;/p&gt;&lt;h3&gt;¿Cómo se forman las construcciones más frecuentes?&lt;/h3&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;haben + Partizip II:&lt;/b&gt; Ich &lt;b&gt;habe gelernt&lt;/b&gt;. — He estudiado. (Perfekt)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;sein + Partizip II:&lt;/b&gt; Er &lt;b&gt;ist gegangen&lt;/b&gt;. — Él se ha ido. (Perfekt)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;werden + infinitivo:&lt;/b&gt; Ich &lt;b&gt;werde lernen&lt;/b&gt;. — Estudiaré. (Futur I)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;werden + Partizip II:&lt;/b&gt; Das Haus &lt;b&gt;wird gebaut&lt;/b&gt;. — La casa es construida / está siendo construida. (Vorgangspassiv)&lt;/div&gt;&lt;h3&gt;Atención&lt;/h3&gt;&lt;p&gt;&lt;i&gt;haben, sein&lt;/i&gt; y &lt;i&gt;werden&lt;/i&gt; no son siempre auxiliares. Su función depende de la construcción: &lt;i&gt;Ich habe Zeit&lt;/i&gt;, &lt;i&gt;Ich bin müde&lt;/i&gt;, &lt;i&gt;Ich werde müde&lt;/i&gt;.&lt;/p&gt;`},modal:{title:'Modalverben — verbos modales',body:`&lt;h3&gt;¿Para qué se usan?&lt;/h3&gt;&lt;p&gt;Expresan capacidad, necesidad, permiso, obligación, intención o deseo respecto a una acción.&lt;/p&gt;&lt;h3&gt;¿Cómo se forman?&lt;/h3&gt;&lt;p&gt;Habitualmente, el modal se conjuga y el verbo principal va en &lt;b&gt;infinitivo al final&lt;/b&gt; de la oración.&lt;/p&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich kann schwimmen.&lt;/b&gt; — Sé nadar. (können)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich muss arbeiten.&lt;/b&gt; — Tengo que trabajar. (müssen)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Du darfst gehen.&lt;/b&gt; — Puedes irte; tienes permiso. (dürfen)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Du sollst warten.&lt;/b&gt; — Debes esperar; te lo han indicado. (sollen)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich will lernen.&lt;/b&gt; — Quiero aprender. (wollen)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich mag Musik.&lt;/b&gt; — Me gusta la música. (mögen)&lt;/div&gt;&lt;p&gt;&lt;b&gt;möchten&lt;/b&gt; es una forma de Konjunktiv II de &lt;i&gt;mögen&lt;/i&gt;, muy utilizada para expresar deseos corteses: &lt;i&gt;Ich möchte einen Kaffee.&lt;/i&gt;&lt;/p&gt;`},kopula:{title:'Kopulaverben — verbos copulativos',body:`&lt;h3&gt;¿Para qué se usan?&lt;/h3&gt;&lt;p&gt;Relacionan al sujeto con una cualidad, un estado o una identidad. Los principales son &lt;b&gt;sein, werden y bleiben&lt;/b&gt;.&lt;/p&gt;&lt;h3&gt;¿Cómo se forman?&lt;/h3&gt;&lt;p&gt;&lt;b&gt;Sujeto + verbo copulativo + atributo&lt;/b&gt; (por ejemplo, un adjetivo o sustantivo).&lt;/p&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er ist müde.&lt;/b&gt; — Está cansado. → Estado.&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er wird müde.&lt;/b&gt; — Se está cansando. → Cambio de estado.&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er bleibt müde.&lt;/b&gt; — Sigue cansado. → Continuidad.&lt;/div&gt;&lt;h3&gt;Una pista importante&lt;/h3&gt;&lt;p&gt;Con profesiones, &lt;i&gt;werden&lt;/i&gt; puede unir al sujeto con un sustantivo en nominativo: &lt;i&gt;Er wird Arzt.&lt;/i&gt; — Se hace médico.&lt;/p&gt;&lt;p&gt;&lt;i&gt;werden&lt;/i&gt; también puede funcionar como auxiliar de futuro o de pasiva. La estructura permite distinguirlo.&lt;/p&gt;`}};

const info={
cambio:{title:'Cambio de estado',rule:'werden + adjetivo o sustantivo',usage:'Expresa que alguien o algo pasa de un estado a otro. No significa «estar», sino «ponerse», «volverse» o «llegar a ser».',examples:[['Ich werde müde.','Me estoy cansando.'],['Es wird kalt.','Está empezando a hacer frío.'],['Sie wird Ärztin.','Ella se hará médica.']],note:'En Perfekt se usa &lt;strong&gt;geworden&lt;/strong&gt;: &lt;em&gt;Er ist müde geworden.&lt;/em&gt; (Se ha cansado).'},
futuro:{title:'Futuro con werden',rule:'werden (conjugado) + infinitivo al final',usage:'Permite hablar de hechos futuros, predicciones o suposiciones. En alemán también se utiliza mucho el Präsens para hablar del futuro.',examples:[['Ich werde morgen arbeiten.','Mañana trabajaré.'],['Er wird bald kommen.','Él vendrá pronto.'],['Sie wird schon zu Hause sein.','Probablemente ya estará en casa.']],note:'Futur II: &lt;strong&gt;werden + Partizip II + haben/sein&lt;/strong&gt;, por ejemplo: &lt;em&gt;Er wird angekommen sein.&lt;/em&gt; Puede expresar una suposición sobre un hecho ya terminado.'},
pasiva:{title:'Voz pasiva de proceso (Vorgangspassiv)',rule:'werden (conjugado) + Partizip II',usage:'El sujeto recibe la acción. La atención se centra en lo que ocurre, no necesariamente en quién lo hace.',examples:[['Das Haus wird gebaut.','La casa está siendo construida.'],['Das Haus wurde gebaut.','La casa fue construida.'],['Das Haus ist gebaut worden.','La casa ha sido construida.'],['Das Haus wird gebaut werden.','La casa será construida.']],note:'En el Perfekt pasivo se utiliza &lt;strong&gt;worden&lt;/strong&gt;, no &lt;em&gt;geworden&lt;/em&gt;: &lt;em&gt;ist gebaut worden&lt;/em&gt;. No confundir con la pasiva de estado: &lt;em&gt;Das Haus ist gebaut.&lt;/em&gt;'},
hipotesis:{title:'Konjunktiv II con würde',rule:'würde (conjugado) + infinitivo',usage:'Expresa situaciones hipotéticas, deseos o formulaciones corteses. &lt;em&gt;Würde&lt;/em&gt; es la forma de Konjunktiv II de &lt;em&gt;werden&lt;/em&gt;.',examples:[['Ich würde gern reisen.','Me gustaría viajar.'],['Wenn ich Zeit hätte, würde ich kommen.','Si tuviera tiempo, vendría.'],['Würdest du mir helfen?','¿Me ayudarías?']],note:'No todas las hipótesis requieren &lt;em&gt;würde&lt;/em&gt;: también son frecuentes formas como &lt;em&gt;hätte, wäre, könnte&lt;/em&gt;. Para hipótesis pasadas: &lt;em&gt;Ich hätte mehr gelernt.&lt;/em&gt;'}};
const panel=document.getElementById('details');document.querySelectorAll('.node').forEach(b=&gt;b.addEventListener('click',()=&gt;{document.querySelectorAll('.node').forEach(n=&gt;n.setAttribute('aria-pressed',String(n===b)));const d=info[b.dataset.key];panel.innerHTML=`&lt;h2&gt;${d.title}&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;¿Para qué se usa?&lt;/strong&gt; ${d.usage}&lt;/p&gt;&lt;h3&gt;Cómo se forma&lt;/h3&gt;&lt;div class=&quot;rule&quot;&gt;${d.rule}&lt;/div&gt;&lt;h3&gt;Ejemplos&lt;/h3&gt;${d.examples.map(e=&gt;`&lt;div class=&quot;ex&quot;&gt;&lt;strong&gt;${e[0]}&lt;/strong&gt;&lt;br&gt;&lt;em&gt;${e[1]}&lt;/em&gt;&lt;/div&gt;`).join('')}&lt;p class=&quot;note&quot;&gt;&lt;strong&gt;Importante:&lt;/strong&gt; ${d.note}&lt;/p&gt;&lt;button class=&quot;return&quot; id=&quot;back&quot;&gt;↑ Volver al mapa&lt;/button&gt;`;panel.classList.add('visible');document.getElementById('back').addEventListener('click',()=&gt;document.getElementById('diagram').scrollIntoView({behavior:'smooth',block:'start'}));panel.scrollIntoView({behavior:'smooth',block:'start'});}));
&lt;/script&gt;&lt;script&gt;(function(){
const btn=document.getElementById('werden-general');const panel=document.getElementById('details');
btn.setAttribute('aria-pressed','false');
btn.addEventListener('click',function(){
 document.querySelectorAll('.node').forEach(n=&gt;n.setAttribute('aria-pressed','false'));
 btn.setAttribute('aria-pressed','true');
 panel.innerHTML=`&lt;h2&gt;Werden — información general&lt;/h2&gt;
 &lt;p&gt;&lt;strong&gt;¿Qué clase de verbo es?&lt;/strong&gt; &lt;em&gt;Werden&lt;/em&gt; es irregular y puede actuar como &lt;strong&gt;verbo copulativo&lt;/strong&gt; (cambio de estado), como &lt;strong&gt;auxiliar&lt;/strong&gt; (futuro y pasiva) y, en su forma &lt;em&gt;würde&lt;/em&gt;, para construir expresiones habituales del &lt;strong&gt;Konjunktiv II&lt;/strong&gt;. Su función depende de la construcción.&lt;/p&gt;
 &lt;h3&gt;Conjugación básica&lt;/h3&gt;
 &lt;table class=&quot;conj&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Persona&lt;/th&gt;&lt;th&gt;Präsens&lt;/th&gt;&lt;th&gt;Präteritum&lt;/th&gt;&lt;th&gt;Konjunktiv II&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;ich&lt;/td&gt;&lt;td&gt;werde&lt;/td&gt;&lt;td&gt;wurde&lt;/td&gt;&lt;td&gt;würde&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;du&lt;/td&gt;&lt;td&gt;wirst&lt;/td&gt;&lt;td&gt;wurdest&lt;/td&gt;&lt;td&gt;würdest&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;er/sie/es&lt;/td&gt;&lt;td&gt;wird&lt;/td&gt;&lt;td&gt;wurde&lt;/td&gt;&lt;td&gt;würde&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;wir&lt;/td&gt;&lt;td&gt;werden&lt;/td&gt;&lt;td&gt;wurden&lt;/td&gt;&lt;td&gt;würden&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;ihr&lt;/td&gt;&lt;td&gt;werdet&lt;/td&gt;&lt;td&gt;wurdet&lt;/td&gt;&lt;td&gt;würdet&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;sie/Sie&lt;/td&gt;&lt;td&gt;werden&lt;/td&gt;&lt;td&gt;wurden&lt;/td&gt;&lt;td&gt;würden&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
 &lt;h3&gt;Konjunktiv I (discurso indirecto)&lt;/h3&gt;
 &lt;p&gt;&lt;strong&gt;ich werde · du werdest · er/sie/es werde · wir werden · ihr werdet · sie/Sie werden&lt;/strong&gt;.&lt;/p&gt;
 &lt;div class=&quot;ex&quot;&gt;&lt;strong&gt;Er sagt, er werde morgen kommen.&lt;/strong&gt;&lt;br&gt;&lt;em&gt;Dice que vendrá mañana (estilo indirecto).&lt;/em&gt;&lt;/div&gt;
 &lt;h3&gt;Formas que conviene distinguir&lt;/h3&gt;
 &lt;table class=&quot;conj&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Forma&lt;/th&gt;&lt;th&gt;Función&lt;/th&gt;&lt;th&gt;Ejemplo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;wird&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Präsens, 3.ª persona singular&lt;/td&gt;&lt;td&gt;Er wird müde.&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;wurde&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Präteritum&lt;/td&gt;&lt;td&gt;Das Haus wurde gebaut.&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;würde&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Konjunktiv II&lt;/td&gt;&lt;td&gt;Ich würde helfen.&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;geworden&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Partizip II: cambio de estado&lt;/td&gt;&lt;td&gt;Er ist müde geworden.&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;worden&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Participio usado en pasiva compuesta&lt;/td&gt;&lt;td&gt;Das Haus ist gebaut worden.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
 &lt;div class=&quot;general-tip&quot;&gt;&lt;strong&gt;Regla para reconocerlo:&lt;/strong&gt; adjetivo/sustantivo → cambio de estado; infinitivo → futuro; Partizip II → pasiva; &lt;em&gt;würde&lt;/em&gt; + infinitivo → hipótesis o cortesía. Son pistas útiles, no reglas mecánicas para todas las oraciones.&lt;/div&gt;
 &lt;h3&gt;Particularidades importantes&lt;/h3&gt;
 &lt;p&gt;Con un sustantivo como atributo, el verbo copulativo mantiene el &lt;strong&gt;nominativo&lt;/strong&gt;: &lt;em&gt;Er wird ein guter Lehrer.&lt;/em&gt; (Se convertirá en un buen profesor).&lt;/p&gt;
 &lt;p&gt;El &lt;strong&gt;Futur I&lt;/strong&gt; no es obligatorio para hablar del futuro: &lt;em&gt;Morgen arbeite ich.&lt;/em&gt; también expresa una acción futura.&lt;/p&gt;
 &lt;p&gt;En el &lt;strong&gt;Perfekt de cambio de estado&lt;/strong&gt; se usa &lt;em&gt;sein + geworden&lt;/em&gt;; en el &lt;strong&gt;Perfekt pasivo&lt;/strong&gt;, &lt;em&gt;sein + Partizip II + worden&lt;/em&gt;.&lt;/p&gt;
 &lt;button class=&quot;return&quot; id=&quot;back-general&quot;&gt;↑ Volver al mapa&lt;/button&gt;`;
 panel.classList.add('visible');
 panel.querySelector('#back-general').addEventListener('click',()=&gt;document.getElementById('diagram').scrollIntoView({behavior:'smooth',block:'start'}));
 panel.scrollIntoView({behavior:'smooth',block:'start'});
});
 document.querySelectorAll('.node').forEach(n=&gt;n.addEventListener('click',()=&gt;btn.setAttribute('aria-pressed','false')));
})();&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;" title="Werden"></iframe>
