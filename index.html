8px;width:190px;height:105px&quot;&gt;&lt;strong&gt;Zustandspassiv&lt;/strong&gt;&lt;span&gt;estado / resultado&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;node&quot; data-id=&quot;eswird&quot; style=&quot;--accent:#d83c98;left:1090px;top:798px;width:140px;height:105px&quot;&gt;&lt;strong&gt;Es wird…&lt;/strong&gt;&lt;span&gt;pasiva impersonal&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;node&quot; data-id=&quot;man&quot; style=&quot;--accent:#d83c98;left:1245px;top:798px;width:140px;height:105px&quot;&gt;&lt;strong&gt;Man…&lt;/strong&gt;&lt;span&gt;activa impersonal&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;group-label&quot; style=&quot;left:45px;top:720px;width:560px;--accent:#70bd40;font-size:14px&quot;&gt;FORMAS NO PERSONALES · SIN TIEMPOS PROPIOS&lt;/div&gt;&lt;div class=&quot;group-label&quot; style=&quot;left:665px;top:720px;width:375px;--accent:#e2ae1b&quot;&gt;VOZ PASIVA · acción vs. estado&lt;/div&gt;&lt;div class=&quot;group-label&quot; style=&quot;left:1080px;top:720px;width:305px;--accent:#d83c98&quot;&gt;CONSTRUCCIONES IMPERSONALES&lt;/div&gt;&lt;div style=&quot;position:absolute;left:530px;top:621px;width:340px;height:68px;background:#e5ebf5;border:3px solid #647a98;border-radius:20px;color:#193a60;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:17px;line-height:1.3;z-index:2;box-shadow:0 5px 12px #193a601a&quot;&gt;FORMAS Y CONSTRUCCIONES RELACIONADAS&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bottom-footnote&quot; style=&quot;background:#eef9e9;border:2px solid #70bd40;border-radius:12px;padding:12px 16px;font-size:15px;line-height:1.5;color:#245328&quot;&gt;&lt;b&gt;IMPORTANTE: las formas no personales NO tienen tiempos ni modos propios.&lt;/b&gt; Los recuadros inferiores son &lt;b&gt;ejemplos de construcciones del indicativo, del Konjunktiv o de la voz pasiva&lt;/b&gt; en las que intervienen estas formas; no son tiempos del infinitivo ni de los participios. &lt;b&gt;Infinitiv:&lt;/b&gt; werde lernen (Futur I), würde lernen (Konjunktiv II). &lt;b&gt;Partizip II:&lt;/b&gt; habe gelernt (Perfekt), hätte gelernt (Konjunktiv II pasado), wird geschrieben (pasiva). En Futur II intervienen tanto Partizip II como el infinitivo de haben/sein. La voz pasiva no es un tiempo verbal.&lt;/div&gt;&lt;section aria-live=&quot;polite&quot; class=&quot;detail&quot; id=&quot;detail&quot;&gt;&lt;p class=&quot;muted&quot;&gt;EXPLICACIÓN DEL NODO&lt;/p&gt;&lt;h2 id=&quot;detailTitle&quot;&gt;Selecciona un elemento del mapa&lt;/h2&gt;&lt;p id=&quot;lead&quot;&gt;Aquí aparecerá la explicación completa, sin quitar espacio al mapa.&lt;/p&gt;&lt;div class=&quot;hidden&quot; id=&quot;more&quot;&gt;&lt;div class=&quot;detail-grid&quot;&gt;&lt;section&gt;&lt;h3&gt;Uso y significado&lt;/h3&gt;&lt;p id=&quot;meaning&quot;&gt;&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Relación con otras partes&lt;/h3&gt;&lt;p id=&quot;relation&quot;&gt;&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;formation hidden&quot; id=&quot;formation&quot;&gt;&lt;h3&gt;¿Cómo se forma?&lt;/h3&gt;&lt;p id=&quot;formationRule&quot;&gt;&lt;/p&gt;&lt;p class=&quot;formationExample&quot; id=&quot;formationExample&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;example&quot;&gt;&lt;h3&gt;Ejemplo&lt;/h3&gt;&lt;p id=&quot;example&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;related hidden&quot; id=&quot;links&quot;&gt;&lt;/div&gt;&lt;div class=&quot;extra hidden&quot; id=&quot;temporal&quot;&gt;&lt;/div&gt;&lt;div class=&quot;extra hidden&quot; id=&quot;extra&quot;&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:14px&quot;&gt;&lt;button class=&quot;back&quot; id=&quot;back&quot;&gt;↩ Regresar a la infografía principal&lt;/button&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;script&gt;
const data={&quot;indicativ&quot;: [&quot;Indicativ&quot;, &quot;Hechos y realidad&quot;, &quot;Modo de hechos, descripciones, narraciones y planes. Incluye seis tiempos verbales.&quot;, &quot;Ich lerne Deutsch. — Aprendo alemán.&quot;, &quot;Los seis tiempos se representan en la rama azul.&quot;], &quot;praesens&quot;: [&quot;Präsens&quot;, &quot;Presente / futuro próximo&quot;, &quot;Expresa acciones actuales, hábitos, verdades generales y futuro indicado por el contexto.&quot;, &quot;Morgen lerne ich Deutsch. — Mañana estudio alemán.&quot;, &quot;Puede referirse al futuro sin usar Futur I.&quot;], &quot;praeteritum&quot;: [&quot;Präteritum&quot;, &quot;Pasado narrativo&quot;, &quot;Se usa para narrar acontecimientos pasados; también es común al hablar con sein, haben y verbos modales.&quot;, &quot;Ich lernte Deutsch. — Estudiaba / estudié alemán.&quot;, &quot;Contrasta con Perfekt, habitual en la conversación.&quot;], &quot;perfekt&quot;: [&quot;Perfekt&quot;, &quot;Pasado hablado&quot;, &quot;Se usa frecuentemente para contar hechos pasados en la conversación.&quot;, &quot;Ich habe Deutsch gelernt. — He estudiado / estudié alemán.&quot;, &quot;Utiliza Partizip II.&quot;], &quot;plusquam&quot;: [&quot;Plusquamperfekt&quot;, &quot;Anterioridad en el pasado&quot;, &quot;Expresa una acción que ocurrió antes de otra acción pasada.&quot;, &quot;Ich hatte gegessen, bevor er kam. — Había comido antes de que llegara.&quot;, &quot;Anterior al Präteritum o Perfekt de otro suceso pasado.&quot;], &quot;futur1&quot;: [&quot;Futur I&quot;, &quot;Futuro / suposición&quot;, &quot;Expresa futuro explícito o una conjetura sobre el presente.&quot;, &quot;Ich werde Deutsch lernen. — Estudiaré alemán.&quot;, &quot;Usa Infinitiv y werden.&quot;], &quot;futur2&quot;: [&quot;Futur II&quot;, &quot;Futuro terminado / conjetura&quot;, &quot;Expresa una acción futura ya concluida o una conjetura sobre un hecho pasado.&quot;, &quot;Bis morgen werde ich es gelernt haben. — Para mañana lo habré aprendido.&quot;, &quot;Utiliza Partizip II y haben/sein.&quot;], &quot;konj1&quot;: [&quot;Konjunktiv I&quot;, &quot;Discurso indirecto&quot;, &quot;Se utiliza para reproducir declaraciones, sobre todo en periodismo, sin afirmarlas como propias.&quot;, &quot;Er sagt, er sei müde. — Dice que está cansado.&quot;, &quot;No es simplemente un tiempo: es un modo.&quot;], &quot;konj2&quot;: [&quot;Konjunktiv II&quot;, &quot;Hipótesis y cortesía&quot;, &quot;Expresa situaciones hipotéticas, deseos, condiciones irreales y peticiones corteses.&quot;, &quot;Wenn ich Zeit hätte, würde ich lernen. — Si tuviera tiempo, estudiaría.&quot;, &quot;También tiene formas para el pasado hipotético.&quot;], &quot;imperativ&quot;: [&quot;Imperativ&quot;, &quot;Órdenes y peticiones&quot;, &quot;Se usa para instrucciones, peticiones, invitaciones y órdenes dirigidas a alguien.&quot;, &quot;Sprechen Sie langsamer! — ¡Hable más despacio!&quot;, &quot;Formas para du, ihr y Sie.&quot;], &quot;infinitiv&quot;: [&quot;Infinitiv&quot;, &quot;Forma base&quot;, &quot;Forma no conjugada del verbo, usada con verbos modales y otras construcciones.&quot;, &quot;lernen — aprender.&quot;, &quot;Con werden forma Futur I.&quot;], &quot;part1&quot;: [&quot;Partizip I&quot;, &quot;Participio presente&quot;, &quot;Sirve sobre todo para describir una acción simultánea; suele funcionar como adjetivo.&quot;, &quot;lernend — aprendiendo / que aprende.&quot;, &quot;No se usa para formar Perfekt.&quot;], &quot;part2&quot;: [&quot;Partizip II&quot;, &quot;Participio pasado&quot;, &quot;Forma usada en Perfekt, Plusquamperfekt, Futur II y pasiva de proceso.&quot;, &quot;gelernt — aprendido.&quot;, &quot;Con haben/sein forma tiempos compuestos; con werden, pasiva.&quot;], &quot;vorgang&quot;: [&quot;Vorgangspassiv&quot;, &quot;Acción / proceso&quot;, &quot;Destaca la acción o proceso, no su resultado.&quot;, &quot;Der Brief wird geschrieben. — La carta está siendo escrita.&quot;, &quot;werden puede indicar futuro o pasiva según la construcción.&quot;], &quot;zustand&quot;: [&quot;Zustandspassiv&quot;, &quot;Estado / resultado&quot;, &quot;Describe un estado, frecuentemente resultado de una acción previa.&quot;, &quot;Die Tür ist geschlossen. — La puerta está cerrada.&quot;, &quot;Contrasta con Vorgangspassiv, que destaca la acción.&quot;], &quot;eswird&quot;: [&quot;Es wird…&quot;, &quot;Pasiva impersonal&quot;, &quot;Permite hablar de una acción sin mencionar un agente concreto.&quot;, &quot;Es wird gearbeitet. — Se trabaja.&quot;, &quot;Es no siempre es obligatorio: Heute wird gearbeitet.&quot;], &quot;werden&quot;: [&quot;Werden: tres funciones&quot;, &quot;Cambio de estado, futuro y pasiva&quot;, &quot;Werden puede ser verbo pleno (cambio de estado) o auxiliar (futuro y pasiva). La estructura completa permite distinguir su función.&quot;, &quot;Er wird müde. / Er wird lernen. / Das Haus wird gebaut.&quot;, &quot;Futur I utiliza infinitivo; la pasiva utiliza Partizip II; el cambio de estado emplea un atributo.&quot;], &quot;werden-zustand&quot;: [&quot;Werden: cambio de estado&quot;, &quot;Pasar de un estado a otro&quot;, &quot;Como verbo pleno, werden expresa que alguien o algo cambia o se transforma. No indica por sí mismo futuro ni pasiva.&quot;, &quot;Er wird müde. — Se está cansando. / Es wurde kalt. — Empezó a hacer frío.&quot;, &quot;En Perfekt: Er ist müde geworden. En pasiva Perfekt se utiliza worden, sin ge-.&quot;], &quot;man&quot;: [&quot;Man…&quot;, &quot;Activa impersonal&quot;, &quot;Permite expresar acciones de personas en general, sin identificarlas.&quot;, &quot;Man spricht Deutsch. — Se habla alemán.&quot;, &quot;Es una construcción activa, no pasiva.&quot;]};const formations={&quot;praesens&quot;: [&quot;Raíz verbal + terminación de presente.&quot;, &quot;lernen → ich lerne, du lernst, er lernt.&quot;], &quot;praeteritum&quot;: [&quot;Verbos débiles: raíz + -te + terminación; verbos fuertes: forma de pasado propia.&quot;, &quot;lernen → ich lernte; gehen → ich ging; sein → ich war.&quot;], &quot;perfekt&quot;: [&quot;haben o sein en Präsens + Partizip II.&quot;, &quot;Ich habe gelernt. / Ich bin gegangen.&quot;], &quot;plusquam&quot;: [&quot;haben o sein en Präteritum (hatte / war) + Partizip II.&quot;, &quot;Ich hatte gelernt. / Ich war gegangen.&quot;], &quot;futur1&quot;: [&quot;werden en Präsens + Infinitiv.&quot;, &quot;Ich werde lernen.&quot;], &quot;futur2&quot;: [&quot;werden en Präsens + Partizip II + haben o sein en Infinitiv.&quot;, &quot;Ich werde gelernt haben. / Ich werde gegangen sein.&quot;], &quot;konj1&quot;: [&quot;Formas de Konjunktiv I, normalmente derivadas de la raíz del infinitivo + terminaciones propias; algunas coinciden con Indicativ.&quot;, &quot;sein → er sei; haben → er habe; kommen → er komme.&quot;], &quot;konj2&quot;: [&quot;Formas propias (a menudo derivadas del Präteritum) o würde + Infinitiv. Para el pasado: hätte/wäre + Partizip II.&quot;, &quot;ich hätte; ich wäre; ich würde lernen; ich hätte gelernt.&quot;], &quot;imperativ&quot;: [&quot;Formas para du, ihr y Sie. Con Sie: infinitivo + Sie.&quot;, &quot;Komm! / Kommt! / Kommen Sie!&quot;], &quot;infinitiv&quot;: [&quot;Forma básica del verbo, generalmente terminada en -en o -n.&quot;, &quot;lernen, machen, wandern.&quot;], &quot;part1&quot;: [&quot;Infinitiv + d; si se usa como adjetivo, añade la terminación correspondiente.&quot;, &quot;lernen → lernend → das lernende Kind.&quot;], &quot;part2&quot;: [&quot;Verbos débiles: normalmente ge- + raíz + -t; muchos fuertes: ge- + raíz (a veces modificada) + -en. Hay excepciones.&quot;, &quot;lernen → gelernt; schreiben → geschrieben; besuchen → besucht.&quot;], &quot;vorgang&quot;: [&quot;werden conjugado + Partizip II.&quot;, &quot;Die Tür wird geöffnet.&quot;], &quot;zustand&quot;: [&quot;sein conjugado + Partizip II.&quot;, &quot;Die Tür ist geöffnet.&quot;], &quot;eswird&quot;: [&quot;werden en 3.ª persona singular + Partizip II; «es» puede ocupar la primera posición, pero no siempre aparece.&quot;, &quot;Es wird getanzt. / Heute wird getanzt.&quot;], &quot;werden&quot;: [&quot;Según la función: werden + atributo; werden + Infinitiv; werden + Partizip II.&quot;, &quot;Er wird müde. / Er wird lernen. / Das Haus wird gebaut.&quot;], &quot;werden-zustand&quot;: [&quot;werden conjugado + adjetivo, sustantivo o atributo; en Perfekt: sein + geworden.&quot;, &quot;Er wird Arzt. / Er ist müde geworden.&quot;], &quot;man&quot;: [&quot;man + verbo conjugado en tercera persona singular.&quot;, &quot;Man lernt Deutsch.&quot;]};const temporalDetails={&quot;konj1&quot;: &quot;&lt;h3&gt;Tiempos del Konjunktiv I&lt;/h3&gt;&lt;p&gt;Se distingue principalmente entre &lt;b&gt;presente, pasado y futuro&lt;/b&gt;. También existe Futur II, aunque es poco frecuente.&lt;/p&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;Präsens:&lt;/b&gt; er &lt;b&gt;lerne&lt;/b&gt; — que él estudia&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;Perfekt (pasado):&lt;/b&gt; er &lt;b&gt;habe gelernt&lt;/b&gt; — que él ha estudiado / estudió&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;Futur I:&lt;/b&gt; er &lt;b&gt;werde lernen&lt;/b&gt; — que él estudiará&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;Futur II:&lt;/b&gt; er &lt;b&gt;werde gelernt haben&lt;/b&gt; — que él habrá estudiado&lt;/div&gt;&lt;p&gt;En el discurso indirecto, cuando una forma coincide con el indicativo, a menudo se sustituye por Konjunktiv II para distinguirla.&lt;/p&gt;&quot;, &quot;konj2&quot;: &quot;&lt;h3&gt;Referencias temporales del Konjunktiv II&lt;/h3&gt;&lt;p&gt;Se estudian sobre todo &lt;b&gt;presente/futuro hipotético&lt;/b&gt; y &lt;b&gt;pasado hipotético&lt;/b&gt;. No tiene seis tiempos independientes como el indicativo.&lt;/p&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;Presente o futuro:&lt;/b&gt; Ich &lt;b&gt;hätte&lt;/b&gt; Zeit. — Tendría tiempo.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;Presente o futuro (würde):&lt;/b&gt; Ich &lt;b&gt;würde lernen&lt;/b&gt;. — Estudiaría.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;Pasado:&lt;/b&gt; Ich &lt;b&gt;hätte gelernt&lt;/b&gt;. — Habría estudiado.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;Pasado con sein:&lt;/b&gt; Ich &lt;b&gt;wäre gegangen&lt;/b&gt;. — Me habría ido.&lt;/div&gt;&lt;p&gt;La forma &lt;i&gt;hätte&lt;/i&gt; procede históricamente del Präteritum, pero puede expresar una hipótesis actual; no significa necesariamente pasado.&lt;/p&gt;&quot;, &quot;imperativ&quot;: &quot;&lt;h3&gt;¿Qué tiempos tiene el Imperativ?&lt;/h3&gt;&lt;p&gt;El &lt;b&gt;Imperativ no tiene tiempos verbales&lt;/b&gt; como Präsens, Perfekt o Präteritum. Expresa una orden, petición o invitación que normalmente debe cumplirse ahora o en el futuro.&lt;/p&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;du:&lt;/b&gt; &lt;i&gt;Lern!&lt;/i&gt; — ¡Estudia!&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;ihr:&lt;/b&gt; &lt;i&gt;Lernt!&lt;/i&gt; — ¡Estudiad!&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;Sie:&lt;/b&gt; &lt;i&gt;Lernen Sie!&lt;/i&gt; — ¡Estudie(n)!&lt;/div&gt;&lt;p&gt;Puede acompañarse de una referencia temporal: &lt;i&gt;Kommen Sie morgen!&lt;/i&gt; — ¡Venga mañana! Eso no crea un tiempo futuro del imperativo.&lt;/p&gt;&quot;};const extraDetails={&quot;vorgang&quot;: &quot;&lt;h3&gt;La pasiva también tiene tiempos verbales&lt;/h3&gt;&lt;p&gt;El auxiliar &lt;i&gt;werden&lt;/i&gt; cambia de forma según el tiempo; el verbo principal permanece en Partizip II.&lt;/p&gt;&lt;table class='passive-table'&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Tiempo&lt;/th&gt;&lt;th&gt;Ejemplo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Präsens&lt;/td&gt;&lt;td&gt;Das Haus &lt;b&gt;wird gebaut&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Präteritum&lt;/td&gt;&lt;td&gt;Das Haus &lt;b&gt;wurde gebaut&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Perfekt&lt;/td&gt;&lt;td&gt;Das Haus &lt;b&gt;ist gebaut worden&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Plusquamperfekt&lt;/td&gt;&lt;td&gt;Das Haus &lt;b&gt;war gebaut worden&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Futur I&lt;/td&gt;&lt;td&gt;Das Haus &lt;b&gt;wird gebaut werden&lt;/b&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;b&gt;Atención:&lt;/b&gt; en el Perfekt de la pasiva se usa &lt;i&gt;worden&lt;/i&gt;, no &lt;i&gt;geworden&lt;/i&gt;.&lt;/p&gt;&quot;,&quot;konj1&quot;:&quot;&lt;h3&gt;Uso frecuente en noticias y declaraciones&lt;/h3&gt;&lt;p&gt;El Konjunktiv I permite comunicar lo declarado por otra persona sin presentarlo necesariamente como un hecho comprobado.&lt;/p&gt;&lt;div class='example-line'&gt;&lt;i&gt;Die Polizei erklärte, der Täter habe die Stadt verlassen.&lt;/i&gt;&lt;br&gt;La policía declaró que el autor había abandonado la ciudad.&lt;/div&gt;&lt;p&gt;Se usa especialmente en prensa, informes y declaraciones oficiales.&lt;/p&gt;&quot;,&quot;eswird&quot;:&quot;&lt;h3&gt;Comparación con man&lt;/h3&gt;&lt;div class='example-line'&gt;&lt;b&gt;Pasiva impersonal:&lt;/b&gt; &lt;i&gt;Es wird getanzt.&lt;/i&gt; — Se baila.&lt;/div&gt;&lt;div class='example-line'&gt;&lt;b&gt;Activa impersonal:&lt;/b&gt; &lt;i&gt;Man tanzt hier viel.&lt;/i&gt; — Aquí se baila mucho.&lt;/div&gt;&lt;p&gt;En la pasiva impersonal el agente no se expresa; &lt;i&gt;man&lt;/i&gt; es un sujeto genérico en una oración activa.&lt;/p&gt;&quot;,&quot;man&quot;:&quot;&lt;h3&gt;Comparación con es wird&lt;/h3&gt;&lt;div class='example-line'&gt;&lt;b&gt;Activa impersonal:&lt;/b&gt; &lt;i&gt;Man spricht über Politik.&lt;/i&gt; — Se habla de política.&lt;/div&gt;&lt;div class='example-line'&gt;&lt;b&gt;Pasiva impersonal:&lt;/b&gt; &lt;i&gt;Es wird über Politik gesprochen.&lt;/i&gt; — Se habla de política.&lt;/div&gt;&lt;p&gt;Ambas pueden expresar una idea impersonal, pero tienen estructuras gramaticales diferentes.&lt;/p&gt;&quot;,&quot;werden&quot;:&quot;&lt;h3&gt;Reconocer la función al escuchar&lt;/h3&gt;&lt;div class='example-line'&gt;&lt;b&gt;Cambio de estado:&lt;/b&gt; &lt;i&gt;Er wird müde.&lt;/i&gt; — Se está cansando.&lt;/div&gt;&lt;div class='example-line'&gt;&lt;b&gt;Futuro:&lt;/b&gt; &lt;i&gt;Er wird morgen arbeiten.&lt;/i&gt; — Mañana trabajará.&lt;/div&gt;&lt;div class='example-line'&gt;&lt;b&gt;Pasiva:&lt;/b&gt; &lt;i&gt;Der Bericht wird geschrieben.&lt;/i&gt; — El informe está siendo redactado.&lt;/div&gt;&lt;p&gt;El complemento y, especialmente, la forma verbal final ayudan a identificar la construcción.&lt;/p&gt;&quot;,&quot;werden-zustand&quot;:&quot;&lt;h3&gt;Cambio de estado frente a pasiva&lt;/h3&gt;&lt;div class='example-line'&gt;&lt;i&gt;Er ist müde geworden.&lt;/i&gt; — Se ha cansado.&lt;/div&gt;&lt;div class='example-line'&gt;&lt;i&gt;Der Brief ist geschrieben worden.&lt;/i&gt; — La carta ha sido escrita.&lt;/div&gt;&lt;p&gt;&lt;b&gt;geworden&lt;/b&gt; se usa con &lt;i&gt;werden&lt;/i&gt; como cambio de estado; &lt;b&gt;worden&lt;/b&gt; se usa en el Perfekt de la pasiva de proceso.&lt;/p&gt;&quot;,&quot;infinitiv&quot;: &quot;&lt;h3&gt;¿Para qué sirve el Infinitiv?&lt;/h3&gt;&lt;p&gt;Es la forma que encontrarás en el diccionario: &lt;b&gt;lernen, gehen, schreiben&lt;/b&gt;. No indica por sí sola quién realiza la acción ni cuándo.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Después de un verbo modal:&lt;/b&gt; &lt;i&gt;Ich muss arbeiten.&lt;/i&gt; — Tengo que trabajar.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Para expresar el futuro con werden:&lt;/b&gt; &lt;i&gt;Ich werde morgen arbeiten.&lt;/i&gt; — Mañana trabajaré.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Con zu para expresar un propósito o completar otra expresión:&lt;/b&gt; &lt;i&gt;Ich versuche, Deutsch zu sprechen.&lt;/i&gt; — Intento hablar alemán.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Con um … zu para expresar finalidad:&lt;/b&gt; &lt;i&gt;Ich lerne, um die Prüfung zu bestehen.&lt;/i&gt; — Estudio para aprobar el examen.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;Recuerda:&lt;/b&gt; no todas las construcciones de infinitivo llevan &lt;i&gt;zu&lt;/i&gt;. Tras los verbos modales y el auxiliar &lt;i&gt;werden&lt;/i&gt; del futuro se utiliza sin &lt;i&gt;zu&lt;/i&gt;.&lt;/p&gt;&quot;, &quot;part1&quot;: &quot;&lt;h3&gt;¿Para qué sirve?&lt;/h3&gt;&lt;p&gt;Principalmente para describir a alguien o algo que está realizando una acción. Como adjetivo, recibe terminaciones según el caso, género y determinante.&lt;/p&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;das schlafende Kind&lt;/i&gt; — el niño que duerme / el niño durmiente&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;Die wartenden Menschen stehen draußen.&lt;/i&gt; — Las personas que esperan están afuera.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;Sie kam lächelnd herein.&lt;/i&gt; — Entró sonriendo.&lt;/div&gt;&lt;p&gt;&lt;b&gt;No equivale siempre al gerundio español&lt;/b&gt; y no es el participio usado para formar el Perfekt.&lt;/p&gt;&quot;, &quot;part2&quot;: &quot;&lt;h3&gt;Cuatro usos fundamentales&lt;/h3&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;1. Perfekt:&lt;/b&gt; &lt;i&gt;Ich habe gelernt.&lt;/i&gt; — He estudiado / estudié.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;2. Plusquamperfekt:&lt;/b&gt; &lt;i&gt;Ich hatte gelernt.&lt;/i&gt; — Había estudiado.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;3. Futur II:&lt;/b&gt; &lt;i&gt;Ich werde gelernt haben.&lt;/i&gt; — Habré estudiado.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;4. Pasiva de proceso:&lt;/b&gt; &lt;i&gt;Der Brief wird geschrieben.&lt;/i&gt; — La carta es escrita / está siendo escrita.&lt;/div&gt;&lt;h3&gt;También puede funcionar como adjetivo&lt;/h3&gt;&lt;p&gt;&lt;i&gt;die geschlossene Tür&lt;/i&gt; — la puerta cerrada.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conexión importante:&lt;/b&gt; el mismo Partizip II participa en varias construcciones, pero el auxiliar determina si estamos ante un tiempo compuesto o una pasiva.&lt;/p&gt;&quot;};const relatedNodes={&quot;praesens&quot;: [[&quot;futur1&quot;, &quot;Futuro expresado con Präsens&quot;]], &quot;perfekt&quot;: [[&quot;part2&quot;, &quot;Partizip II&quot;], [&quot;plusquam&quot;, &quot;Plusquamperfekt&quot;]], &quot;plusquam&quot;: [[&quot;part2&quot;, &quot;Partizip II&quot;], [&quot;perfekt&quot;, &quot;Perfekt&quot;]], &quot;futur1&quot;: [[&quot;werden&quot;, &quot;Tres usos de werden&quot;], [&quot;infinitiv&quot;, &quot;Infinitiv&quot;]], &quot;futur2&quot;: [[&quot;part2&quot;, &quot;Partizip II&quot;], [&quot;werden&quot;, &quot;Werden&quot;]], &quot;part2&quot;: [[&quot;perfekt&quot;, &quot;Perfekt&quot;], [&quot;plusquam&quot;, &quot;Plusquamperfekt&quot;], [&quot;futur2&quot;, &quot;Futur II&quot;], [&quot;vorgang&quot;, &quot;Voz pasiva&quot;]], &quot;infinitiv&quot;: [[&quot;futur1&quot;, &quot;Futur I&quot;], [&quot;werden&quot;, &quot;Werden&quot;]], &quot;vorgang&quot;: [[&quot;werden&quot;, &quot;Werden&quot;], [&quot;part2&quot;, &quot;Partizip II&quot;], [&quot;zustand&quot;, &quot;Pasiva de estado&quot;]], &quot;zustand&quot;: [[&quot;vorgang&quot;, &quot;Pasiva de proceso&quot;], [&quot;part2&quot;, &quot;Partizip II&quot;]], &quot;eswird&quot;: [[&quot;man&quot;, &quot;Man (activa impersonal)&quot;], [&quot;vorgang&quot;, &quot;Vorgangspassiv&quot;]], &quot;man&quot;: [[&quot;eswird&quot;, &quot;Es wird (pasiva impersonal)&quot;]], &quot;werden&quot;: [[&quot;werden-zustand&quot;, &quot;Cambio de estado&quot;], [&quot;futur1&quot;, &quot;Futur I&quot;], [&quot;vorgang&quot;, &quot;Vorgangspassiv&quot;]], &quot;werden-zustand&quot;: [[&quot;werden&quot;, &quot;Tres usos de werden&quot;], [&quot;vorgang&quot;, &quot;Pasiva: worden / geworden&quot;]], &quot;konj1&quot;: [[&quot;konj2&quot;, &quot;Konjunktiv II&quot;]], &quot;konj2&quot;: [[&quot;konj1&quot;, &quot;Konjunktiv I&quot;]]};Object.assign(data,{&quot;konj2&quot;:[&quot;Konjunktiv II&quot;,&quot;Irrealidad, hipótesis, deseos y cortesía&quot;,&quot;El libro distingue dos formas temporales: presente y pasado. No hay futuro independiente; el presente también puede referirse al futuro.&quot;,&quot;Wenn ich Zeit hätte, würde ich kommen. — Si tuviera tiempo, vendría.&quot;,&quot;Pulsa los cuatro nodos para consultar las formas activas y pasivas.&quot;],&quot;konj2-pres&quot;:[&quot;Konjunktiv II · presente&quot;,&quot;Presente o futuro eventual&quot;,&quot;Forma simple derivada del Präteritum, a menudo con Umlaut; o perífrasis würde + infinitivo.&quot;,&quot;Ich käme gern. / Ich würde gern kommen. — Vendría con gusto.&quot;,&quot;Morgen würde ich kommen es presente de Konjunktiv II con referencia futura.&quot;],&quot;konj2-past&quot;:[&quot;Konjunktiv II · pasado&quot;,&quot;Hipótesis pasada no realizada&quot;,&quot;hätte o wäre + Partizip II. Solo una forma de pasado frente a tres del indicativo.&quot;,&quot;Ich hätte gelernt. / Ich wäre gekommen. — Habría estudiado / venido.&quot;,&quot;Para pasado hipotético se emplea normalmente hätte/wäre + participio.&quot;],&quot;konj2-pass-pres&quot;:[&quot;Konjunktiv II · pasiva presente&quot;,&quot;Proceso hipotético&quot;,&quot;würde + Partizip II.&quot;,&quot;Ihm würde geholfen. — Se le ayudaría.&quot;,&quot;Vorgangspassiv: acción o proceso.&quot;],&quot;konj2-pass-past&quot;:[&quot;Konjunktiv II · pasiva pasado&quot;,&quot;Proceso hipotético pasado&quot;,&quot;wäre + Partizip II + worden.&quot;,&quot;Ihm wäre geholfen worden. — Se le habría ayudado.&quot;,&quot;En la pasiva compuesta: worden, no geworden.&quot;]});Object.assign(formations,{&quot;konj2&quot;:[&quot;Presente: forma propia desde Präteritum o würde + infinitivo. Pasado: hätte/wäre + Partizip II.&quot;,&quot;käme / würde kommen; hätte gelernt / wäre gekommen.&quot;],&quot;konj2-pres&quot;:[&quot;Raíz del Präteritum + -e/-est/-e/-en/-et/-en; en verbos fuertes a menudo Umlaut. Alternativa würde + infinitivo.&quot;,&quot;kam → käme; war → wäre; hatte → hätte; konnte → könnte; lernen → würde lernen.&quot;],&quot;konj2-past&quot;:[&quot;hätte/wäre + Partizip II.&quot;,&quot;hätte gearbeitet; hätte gelesen; wäre gefahren.&quot;],&quot;konj2-pass-pres&quot;:[&quot;würde + Partizip II.&quot;,&quot;Das Haus würde gebaut.&quot;],&quot;konj2-pass-past&quot;:[&quot;wäre + Partizip II + worden.&quot;,&quot;Das Haus wäre gebaut worden.&quot;]});extraDetails[&quot;konj2&quot;]=&quot;&lt;h3&gt;§53 · Dos formas temporales&lt;/h3&gt;&lt;p&gt;&lt;b&gt;Presente:&lt;/b&gt; puede referirse al presente o al futuro: &lt;i&gt;Wenn ich morgen Zeit hätte, käme ich.&lt;/i&gt; &lt;b&gt;Pasado:&lt;/b&gt; &lt;i&gt;Wenn ich Zeit gehabt hätte, wäre ich gekommen.&lt;/i&gt; No hay un tercer tiempo futuro independiente.&lt;/p&gt;&lt;h3&gt;§54 · Usos&lt;/h3&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;1. Optativas irreales:&lt;/b&gt; &lt;i&gt;Wenn ich doch gesund wäre!&lt;/i&gt; — ¡Ojalá estuviera sano! Con &lt;i&gt;wenn&lt;/i&gt;, verbo al final; sin &lt;i&gt;wenn&lt;/i&gt;, al principio. Partículas &lt;i&gt;doch, bloß, nur&lt;/i&gt;.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;2. Condicionales irreales:&lt;/b&gt; &lt;i&gt;Wenn ich Zeit hätte, käme ich zu dir.&lt;/i&gt; — Si tuviera tiempo, iría a verte. Sin &lt;i&gt;wenn&lt;/i&gt;: &lt;i&gt;Hätte ich Zeit, käme ich zu dir.&lt;/i&gt;&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;3. Comparativas irreales:&lt;/b&gt; &lt;i&gt;Sie schaut mich an, als ob sie mich nicht verstünde.&lt;/i&gt; — Me mira como si no me entendiera. Con &lt;i&gt;als ob&lt;/i&gt;, verbo al final; con &lt;i&gt;als&lt;/i&gt;, inmediatamente después.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;4. Consecutivas irreales:&lt;/b&gt; &lt;i&gt;Es ist zu spät, als dass wir noch anrufen könnten.&lt;/i&gt; — Es demasiado tarde para que pudiéramos llamar. También &lt;i&gt;so … dass&lt;/i&gt; y &lt;i&gt;ohne dass&lt;/i&gt;.&lt;/div&gt;&lt;div class=\&quot;example-line\&quot;&gt;&lt;b&gt;5. Cortesía:&lt;/b&gt; &lt;i&gt;Könnten Sie mir helfen?&lt;/i&gt; — ¿Podría ayudarme?&lt;/div&gt;&lt;p&gt;&lt;small&gt;Fuente: Dreyer-Schmitt, §§53–54, pp. 247–258.&lt;/small&gt;&lt;/p&gt;&quot;;Object.assign(extraDetails,{&quot;konj2&quot;:&quot;&lt;h3&gt;¿Qué significa Konjunktiv II?&lt;/h3&gt;&lt;p&gt;El indicativo afirma hechos: &lt;b&gt;Ich habe Zeit&lt;/b&gt; = tengo tiempo. El Konjunktiv II expresa una posibilidad imaginada, un deseo contrario a la realidad, una condición hipotética o una petición cortés: &lt;b&gt;Wenn ich Zeit hätte…&lt;/b&gt; = si tuviera tiempo…&lt;/p&gt;&lt;p&gt;&lt;b&gt;Solo dos formas temporales (§53):&lt;/b&gt; presente (también para posibilidades futuras) y pasado. No existe un tiempo futuro independiente: &lt;i&gt;Wenn ich morgen Zeit hätte…&lt;/i&gt; utiliza presente aunque diga «mañana».&lt;/p&gt;&lt;h3&gt;¿Qué tipos de oraciones estudia el §54?&lt;/h3&gt;&lt;p&gt;&lt;b&gt;1. Optativa irreal (irrealer Wunschsatz):&lt;/b&gt; «optativa» significa que expresa un &lt;b&gt;deseo&lt;/b&gt;; «irreal», que ese deseo no coincide con la situación real. &lt;i&gt;Wenn ich doch reich wäre!&lt;/i&gt; = ¡Ojalá fuera rico! La realidad implícita es que no lo soy. Puede llevar &lt;i&gt;wenn&lt;/i&gt; y partículas como &lt;i&gt;doch, bloß, nur&lt;/i&gt;. Con &lt;i&gt;wenn&lt;/i&gt;, el verbo conjugado queda al final: &lt;i&gt;Wenn ich doch mehr Zeit hätte!&lt;/i&gt;; sin &lt;i&gt;wenn&lt;/i&gt;, empieza por el verbo: &lt;i&gt;Hätte ich doch mehr Zeit!&lt;/i&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;2. Condicional irreal (irrealer Bedingungssatz):&lt;/b&gt; una condición que no se cumple o se considera improbable y la consecuencia que tendría. &lt;i&gt;Wenn ich mehr Geld hätte, würde ich reisen.&lt;/i&gt; = Si tuviera más dinero, viajaría. &lt;b&gt;Condición:&lt;/b&gt; &lt;i&gt;wenn ich mehr Geld hätte&lt;/i&gt;; &lt;b&gt;consecuencia:&lt;/b&gt; &lt;i&gt;würde ich reisen&lt;/i&gt;. En pasado: &lt;i&gt;Wenn ich mehr Geld gehabt hätte, wäre ich gereist.&lt;/i&gt; = Si hubiera tenido más dinero, habría viajado.&lt;/p&gt;&lt;p&gt;&lt;b&gt;3. Comparativa irreal (irrealer Vergleichssatz):&lt;/b&gt; compara algo con una situación imaginada, sin afirmar que sea verdadera. &lt;i&gt;Er tut so, als ob er alles wüsste.&lt;/i&gt; = Actúa como si lo supiera todo. La comparación aparece después de &lt;i&gt;als ob&lt;/i&gt;; el verbo va al final. Con &lt;i&gt;als&lt;/i&gt;: &lt;i&gt;Er tut so, als wüsste er alles.&lt;/i&gt; (verbo inmediatamente después de &lt;i&gt;als&lt;/i&gt;).&lt;/p&gt;&lt;p&gt;&lt;b&gt;4. Consecutiva irreal (irrealer Folgesatz):&lt;/b&gt; expresa una consecuencia que no puede producirse en esas circunstancias. &lt;i&gt;Es ist zu spät, als dass wir noch anrufen könnten.&lt;/i&gt; = Es demasiado tarde para que todavía podamos llamar. La estructura &lt;i&gt;zu … als dass&lt;/i&gt; señala que el grado de algo impide el resultado.&lt;/p&gt;&lt;p&gt;&lt;b&gt;5. Cortesía:&lt;/b&gt; &lt;i&gt;Könnten Sie mir helfen?&lt;/i&gt; = ¿Podría ayudarme? No se afirma una imposibilidad; el modo suaviza la petición.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Orientación:&lt;/b&gt; abre los nodos «Presente» y «Pasado» para aprender paso a paso las formas; después las dos formas pasivas.&lt;/p&gt;&quot;,&quot;konj2-pres&quot;:&quot;&lt;h3&gt;Formación del presente del Konjunktiv II (§53)&lt;/h3&gt;&lt;p&gt;&lt;b&gt;Paso 1: busca el Präteritum del indicativo.&lt;/b&gt; Aunque partamos de una forma de pasado, el resultado se usa para hipótesis actuales o futuras. Ejemplo: &lt;i&gt;kommen → kam&lt;/i&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 2: en muchos verbos fuertes, cambia la vocal mediante Umlaut.&lt;/b&gt; &lt;i&gt;kam → käm-&lt;/i&gt;, &lt;i&gt;war → wär-&lt;/i&gt;, &lt;i&gt;hatte → hätt-&lt;/i&gt;, &lt;i&gt;konnte → könnt-&lt;/i&gt;. No todos los verbos fuertes siguen exactamente el mismo cambio: aprende las formas más frecuentes.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 3: añade las terminaciones:&lt;/b&gt; -e, -est, -e, -en, -et, -en.&lt;/p&gt;&lt;table class=\&quot;passive-table\&quot;&gt;&lt;tr&gt;&lt;th&gt;Persona&lt;/th&gt;&lt;th&gt;kommen&lt;/th&gt;&lt;th&gt;sein&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ich&lt;/td&gt;&lt;td&gt;käme&lt;/td&gt;&lt;td&gt;wäre&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;du&lt;/td&gt;&lt;td&gt;kämest&lt;/td&gt;&lt;td&gt;wärest&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;er/sie/es&lt;/td&gt;&lt;td&gt;käme&lt;/td&gt;&lt;td&gt;wäre&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;wir&lt;/td&gt;&lt;td&gt;kämen&lt;/td&gt;&lt;td&gt;wären&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ihr&lt;/td&gt;&lt;td&gt;kämet&lt;/td&gt;&lt;td&gt;wäret&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;sie/Sie&lt;/td&gt;&lt;td&gt;kämen&lt;/td&gt;&lt;td&gt;wären&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h3&gt;¿Y los verbos regulares?&lt;/h3&gt;&lt;p&gt;En los verbos débiles o regulares, el Konjunktiv II simple normalmente coincide con el Präteritum: &lt;i&gt;lernen → lernte&lt;/i&gt;, &lt;i&gt;fragen → fragte&lt;/i&gt;. Como no se distingue claramente del pasado indicativo, suele preferirse &lt;b&gt;würde + infinitivo&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Construcción alternativa:&lt;/b&gt; sujeto + &lt;i&gt;würde&lt;/i&gt; conjugado + … + infinitivo al final. &lt;i&gt;Ich würde Deutsch lernen.&lt;/i&gt; = Yo aprendería alemán. &lt;i&gt;Wenn ich Zeit hätte, würde ich Deutsch lernen.&lt;/i&gt; = Si tuviera tiempo, aprendería alemán.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Importante:&lt;/b&gt; con &lt;i&gt;sein, haben&lt;/i&gt; y los modales se prefieren a menudo las formas propias: &lt;i&gt;wäre, hätte, könnte, müsste, dürfte, sollte&lt;/i&gt;. Ejemplo: &lt;i&gt;Ich könnte kommen.&lt;/i&gt; = Podría venir.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Presente con sentido futuro:&lt;/b&gt; &lt;i&gt;Wenn ich morgen frei hätte, würde ich dich besuchen.&lt;/i&gt; = Si mañana estuviera libre, te visitaría. &lt;i&gt;morgen&lt;/i&gt; sitúa la acción en el futuro, pero NO crea un futuro gramatical del Konjunktiv II.&lt;/p&gt;&lt;h3&gt;Comprueba que lo entiendes&lt;/h3&gt;&lt;p&gt;Indicativo: &lt;i&gt;Ich bin krank&lt;/i&gt; (estoy enfermo). Hipótesis: &lt;i&gt;Wenn ich nicht krank wäre, würde ich arbeiten.&lt;/i&gt; (Si no estuviera enfermo, trabajaría). Identifica &lt;b&gt;wäre&lt;/b&gt; como forma propia y &lt;b&gt;würde arbeiten&lt;/b&gt; como perífrasis.&lt;/p&gt;&quot;,&quot;konj2-past&quot;:&quot;&lt;h3&gt;Formación del pasado del Konjunktiv II (§53)&lt;/h3&gt;&lt;p&gt;Sirve para imaginar un hecho que &lt;b&gt;no sucedió en el pasado&lt;/b&gt;. No se forma a partir de &lt;i&gt;würde + infinitivo&lt;/i&gt;, sino mediante &lt;b&gt;hätte o wäre + Partizip II&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 1:&lt;/b&gt; identifica el infinitivo y su participio: &lt;i&gt;lernen → gelernt&lt;/i&gt;; &lt;i&gt;kommen → gekommen&lt;/i&gt;; &lt;i&gt;fahren → gefahren&lt;/i&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 2:&lt;/b&gt; determina el auxiliar del Perfekt: &lt;i&gt;ich habe gelernt&lt;/i&gt; (haben); &lt;i&gt;ich bin gekommen&lt;/i&gt; (sein).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 3:&lt;/b&gt; cambia el auxiliar a Konjunktiv II: &lt;i&gt;haben → hätte&lt;/i&gt;; &lt;i&gt;sein → wäre&lt;/i&gt;, y coloca el participio al final.&lt;/p&gt;&lt;table class=\&quot;passive-table\&quot;&gt;&lt;tr&gt;&lt;th&gt;Indicativo Perfekt&lt;/th&gt;&lt;th&gt;Konjunktiv II pasado&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ich habe gelernt.&lt;/td&gt;&lt;td&gt;Ich hätte gelernt.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ich bin gekommen.&lt;/td&gt;&lt;td&gt;Ich wäre gekommen.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Er hat gearbeitet.&lt;/td&gt;&lt;td&gt;Er hätte gearbeitet.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sie ist gefahren.&lt;/td&gt;&lt;td&gt;Sie wäre gefahren.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;&lt;b&gt;Comparación de sentido:&lt;/b&gt; &lt;i&gt;Ich bin gekommen.&lt;/i&gt; = Vine / he venido (hecho real). &lt;i&gt;Ich wäre gekommen.&lt;/i&gt; = Habría venido (pero no vine).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Condicional pasada completa:&lt;/b&gt; &lt;i&gt;Wenn ich Zeit gehabt hätte, wäre ich gekommen.&lt;/i&gt; = Si hubiera tenido tiempo, habría venido. La primera parte es la condición irreal pasada; la segunda, la consecuencia que tampoco ocurrió.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Con verbos modales:&lt;/b&gt; cuando un modal acompaña otro infinitivo, aparece frecuentemente el doble infinitivo: &lt;i&gt;Ich hätte kommen können.&lt;/i&gt; = Habría podido venir. No es lo mismo que &lt;i&gt;Ich könnte kommen&lt;/i&gt; = Podría venir (presente).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Regla para recordar:&lt;/b&gt; presente = &lt;i&gt;hätte / wäre / käme / würde kommen&lt;/i&gt;; pasado = &lt;i&gt;hätte gemacht / wäre gekommen&lt;/i&gt;. La presencia del &lt;b&gt;Partizip II&lt;/b&gt; es la pista fundamental.&lt;/p&gt;&quot;,&quot;konj2-pass-pres&quot;:&quot;&lt;h3&gt;Pasiva de acción en Konjunktiv II · presente&lt;/h3&gt;&lt;p&gt;En la pasiva, el sujeto &lt;b&gt;recibe&lt;/b&gt; la acción. Compara: activa &lt;i&gt;Man hilft ihm&lt;/i&gt; = Alguien lo ayuda; pasiva &lt;i&gt;Ihm wird geholfen&lt;/i&gt; = Se le ayuda.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 1:&lt;/b&gt; toma la pasiva indicativa: &lt;i&gt;Das Haus wird gebaut.&lt;/i&gt; = La casa es construida / se construye.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 2:&lt;/b&gt; cambia &lt;i&gt;wird&lt;/i&gt; (indicativo de &lt;i&gt;werden&lt;/i&gt;) por &lt;b&gt;würde&lt;/b&gt; (Konjunktiv II). El participio no cambia: &lt;i&gt;gebaut&lt;/i&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Resultado:&lt;/b&gt; &lt;i&gt;Das Haus würde gebaut.&lt;/i&gt; = La casa sería construida. Fórmula: &lt;b&gt;würde + Partizip II&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;Otro ejemplo: &lt;i&gt;Ihm würde geholfen.&lt;/i&gt; = Se le ayudaría. &lt;i&gt;geholfen&lt;/i&gt; es el participio de &lt;i&gt;helfen&lt;/i&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Atención:&lt;/b&gt; &lt;i&gt;Ich würde das Haus bauen&lt;/i&gt; es activa (yo construiría la casa), mientras que &lt;i&gt;Das Haus würde gebaut&lt;/i&gt; es pasiva (la casa sería construida). En la activa aparece el &lt;b&gt;infinitivo bauen&lt;/b&gt;; en la pasiva, el &lt;b&gt;participio gebaut&lt;/b&gt;.&lt;/p&gt;&quot;,&quot;konj2-pass-past&quot;:&quot;&lt;h3&gt;Pasiva de acción en Konjunktiv II · pasado&lt;/h3&gt;&lt;p&gt;Expresa que una acción &lt;b&gt;habría sido realizada&lt;/b&gt;, pero no lo fue. Fórmula: &lt;b&gt;wäre + Partizip II del verbo principal + worden&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 1:&lt;/b&gt; empieza por la pasiva del presente: &lt;i&gt;Das Haus wird gebaut.&lt;/i&gt; = Se construye la casa.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 2:&lt;/b&gt; recuerda la pasiva del Perfekt indicativo: &lt;i&gt;Das Haus ist gebaut worden.&lt;/i&gt; = La casa ha sido construida.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Paso 3:&lt;/b&gt; cambia &lt;i&gt;ist&lt;/i&gt; por &lt;b&gt;wäre&lt;/b&gt;: &lt;i&gt;Das Haus wäre gebaut worden.&lt;/i&gt; = La casa habría sido construida.&lt;/p&gt;&lt;table class=\&quot;passive-table\&quot;&gt;&lt;tr&gt;&lt;th&gt;Forma&lt;/th&gt;&lt;th&gt;Ejemplo&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Indicativo presente&lt;/td&gt;&lt;td&gt;Das Haus wird gebaut.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Indicativo Perfekt&lt;/td&gt;&lt;td&gt;Das Haus ist gebaut worden.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Konjunktiv II presente&lt;/td&gt;&lt;td&gt;Das Haus würde gebaut.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Konjunktiv II pasado&lt;/td&gt;&lt;td&gt;Das Haus wäre gebaut worden.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;&lt;b&gt;¿Por qué «worden» y no «geworden»?&lt;/b&gt; En la pasiva compuesta de acción se usa &lt;i&gt;worden&lt;/i&gt;: &lt;i&gt;wäre gebaut worden&lt;/i&gt;. &lt;i&gt;geworden&lt;/i&gt; corresponde al verbo &lt;i&gt;werden&lt;/i&gt; con sentido de cambio de estado: &lt;i&gt;Er wäre müde geworden&lt;/i&gt; = Se habría cansado.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Ejemplo completo:&lt;/b&gt; &lt;i&gt;Wenn das Geld vorhanden gewesen wäre, wäre das Haus gebaut worden.&lt;/i&gt; = Si hubiera habido dinero, la casa habría sido construida.&lt;/p&gt;&quot;});extraDetails[&quot;konj2&quot;]=&quot;&lt;h3&gt;Usos del Konjunktiv II: qué significa cada oración y cómo se construye (§54)&lt;/h3&gt;\n&lt;p&gt;El Konjunktiv II sirve para imaginar situaciones distintas de la realidad, expresar deseos, plantear condiciones, hacer comparaciones hipotéticas y formular peticiones de manera cortés. &lt;b&gt;No todas estas oraciones significan lo mismo.&lt;/b&gt; Conviene reconocer primero qué intención tiene el hablante y después observar la posición del verbo.&lt;/p&gt;\n&lt;h3&gt;1. Oraciones optativas irreales (irreale Wunschsätze)&lt;/h3&gt;\n&lt;p&gt;&lt;b&gt;¿Qué son?&lt;/b&gt; «Optativa» significa que expresa un &lt;b&gt;deseo&lt;/b&gt;; «irreal», que lo deseado no corresponde a la realidad o que no llegó a realizarse. No describe un hecho, sino lo que quisiéramos que fuera verdad.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Regla A: con wenn.&lt;/b&gt; La oración comienza con &lt;i&gt;wenn&lt;/i&gt; y el verbo conjugado en Konjunktiv II va &lt;b&gt;al final&lt;/b&gt;: &lt;b&gt;Wenn + sujeto + complementos + Konjunktiv II + !&lt;/b&gt;&lt;/p&gt;\n&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;Wenn ich doch mehr Zeit hätte!&lt;/i&gt; — ¡Ojalá tuviera más tiempo! (No tengo suficiente.)&lt;br&gt;&lt;i&gt;Wenn ich nur gesund wäre!&lt;/i&gt; — ¡Ojalá estuviera sano! (No lo estoy.)&lt;/div&gt;\n&lt;p&gt;&lt;b&gt;Regla B: sin wenn.&lt;/b&gt; El verbo en Konjunktiv II ocupa la &lt;b&gt;primera posición&lt;/b&gt;: &lt;b&gt;Konjunktiv II + sujeto + complementos + !&lt;/b&gt;&lt;/p&gt;\n&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;Hätte ich doch mehr Zeit!&lt;/i&gt; — ¡Ojalá tuviera más tiempo!&lt;br&gt;&lt;i&gt;Wäre ich doch mitgefahren!&lt;/i&gt; — ¡Ojalá hubiera ido con ellos! (Deseo irreal referido al pasado.)&lt;/div&gt;\n&lt;p&gt;Las partículas &lt;b&gt;doch, bloß, nur&lt;/b&gt; refuerzan el deseo; las oraciones optativas suelen terminar con &lt;b&gt;!&lt;/b&gt;. Para deseos cotidianos que no necesariamente contradicen la realidad también se usa &lt;i&gt;ich würde gern + infinitivo&lt;/i&gt;: &lt;i&gt;Ich würde gern nach Berlin reisen.&lt;/i&gt; — Me gustaría viajar a Berlín. Esta última es una expresión de deseo, no necesariamente una optativa irreal exclamativa.&lt;/p&gt;\n&lt;h3&gt;2. Oraciones condicionales irreales (irreale Bedingungssätze)&lt;/h3&gt;\n&lt;p&gt;&lt;b&gt;¿Qué son?&lt;/b&gt; Expresan una &lt;b&gt;condición imaginaria&lt;/b&gt; y lo que sucedería si se cumpliera. Tienen dos partes: &lt;b&gt;condición&lt;/b&gt; y &lt;b&gt;consecuencia&lt;/b&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Regla A: condición con wenn.&lt;/b&gt; En la subordinada introducida por &lt;i&gt;wenn&lt;/i&gt;, el verbo conjugado va &lt;b&gt;al final&lt;/b&gt;. Si la subordinada va primero, la oración principal comienza con el verbo conjugado: &lt;b&gt;Wenn … hätte, würde …&lt;/b&gt;&lt;/p&gt;\n&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;Wenn ich mehr Geld hätte, würde ich ein Haus kaufen.&lt;/i&gt;&lt;br&gt;Si tuviera más dinero, compraría una casa.&lt;br&gt;&lt;b&gt;Condición:&lt;/b&gt; &lt;i&gt;wenn ich mehr Geld hätte&lt;/i&gt;.&lt;br&gt;&lt;b&gt;Consecuencia:&lt;/b&gt; &lt;i&gt;würde ich ein Haus kaufen&lt;/i&gt;.&lt;/div&gt;\n&lt;p&gt;&lt;b&gt;Regla B: condición sin wenn.&lt;/b&gt; La subordinada condicional puede comenzar directamente por el verbo en Konjunktiv II: &lt;i&gt;Hätte ich mehr Geld, würde ich ein Haus kaufen.&lt;/i&gt; — Si tuviera más dinero, compraría una casa.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Regla C: la condición también puede ir después.&lt;/b&gt; &lt;i&gt;Ich würde ein Haus kaufen, wenn ich mehr Geld hätte.&lt;/i&gt; — Compraría una casa si tuviera más dinero.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Presente frente a pasado:&lt;/b&gt; &lt;i&gt;Wenn ich Zeit hätte, käme ich.&lt;/i&gt; — Si tuviera tiempo, iría. / &lt;i&gt;Wenn ich Zeit gehabt hätte, wäre ich gekommen.&lt;/i&gt; — Si hubiera tenido tiempo, habría ido. En el segundo caso hablamos de una oportunidad pasada que ya no se realizó.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Importante (§54):&lt;/b&gt; en ciertos contextos la perífrasis &lt;i&gt;würde + infinitivo&lt;/i&gt; ayuda a evitar la ambigüedad de los verbos regulares, cuyo Konjunktiv II simple coincide con el Präteritum: &lt;i&gt;Wenn ich ihn fragte …&lt;/i&gt; puede resultar ambiguo; &lt;i&gt;Wenn ich ihn fragen würde …&lt;/i&gt; expresa claramente la hipótesis.&lt;/p&gt;\n&lt;h3&gt;3. Oraciones comparativas irreales (irreale Vergleichssätze)&lt;/h3&gt;\n&lt;p&gt;&lt;b&gt;¿Qué son?&lt;/b&gt; Comparan una conducta o situación real con otra &lt;b&gt;imaginaria&lt;/b&gt;. La expresión española característica es &lt;b&gt;«como si»&lt;/b&gt;. No afirmamos que la comparación sea verdadera.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Regla A: als ob / als wenn.&lt;/b&gt; El verbo conjugado va &lt;b&gt;al final&lt;/b&gt; de la subordinada.&lt;/p&gt;\n&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;Er tut so, als ob er alles wüsste.&lt;/i&gt; — Se comporta como si lo supiera todo.&lt;br&gt;&lt;i&gt;Sie sieht aus, als ob sie krank wäre.&lt;/i&gt; — Parece como si estuviera enferma.&lt;/div&gt;\n&lt;p&gt;&lt;b&gt;Regla B: als.&lt;/b&gt; Si se utiliza solamente &lt;i&gt;als&lt;/i&gt;, el verbo conjugado aparece &lt;b&gt;inmediatamente después&lt;/b&gt;: &lt;i&gt;Er tut so, als wüsste er alles.&lt;/i&gt; — Se comporta como si lo supiera todo.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Cómo reconocerla:&lt;/b&gt; identifica un verbo de apariencia o comportamiento (&lt;i&gt;aussehen, tun, sich verhalten&lt;/i&gt;) y una comparación introducida por &lt;i&gt;als ob&lt;/i&gt; o &lt;i&gt;als&lt;/i&gt;.&lt;/p&gt;\n&lt;h3&gt;4. Oraciones consecutivas irreales (irreale Folgesätze)&lt;/h3&gt;\n&lt;p&gt;&lt;b&gt;¿Qué son?&lt;/b&gt; Una oración consecutiva expresa una &lt;b&gt;consecuencia&lt;/b&gt;. Es irreal cuando la consecuencia imaginada &lt;b&gt;no puede producirse&lt;/b&gt; o no se produjo dadas las circunstancias.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Regla A: zu … als dass.&lt;/b&gt; En la oración principal aparece &lt;i&gt;zu&lt;/i&gt; («demasiado»); la subordinada comienza con &lt;i&gt;als dass&lt;/i&gt; y termina con el verbo en Konjunktiv II.&lt;/p&gt;\n&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;Es ist zu spät, als dass wir noch anrufen könnten.&lt;/i&gt;&lt;br&gt;Es demasiado tarde para que todavía podamos llamar.&lt;br&gt;La consecuencia de llamar ya no es posible.&lt;/div&gt;\n&lt;p&gt;&lt;b&gt;Regla B: ohne dass.&lt;/b&gt; Expresa una consecuencia esperada que &lt;b&gt;no se produce&lt;/b&gt;. En las construcciones pertinentes, el libro señala el uso del Konjunktiv II: &lt;i&gt;Er ging weg, ohne dass ich es bemerkt hätte.&lt;/i&gt; — Se marchó sin que yo lo hubiera notado.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Atención:&lt;/b&gt; el libro también estudia las construcciones con &lt;i&gt;so … dass&lt;/i&gt;; la elección entre indicativo y Konjunktiv II depende de si se presenta un resultado real o uno no realizado.&lt;/p&gt;\n&lt;h3&gt;5. Peticiones corteses (höfliche Bitten)&lt;/h3&gt;\n&lt;p&gt;En una petición no hablamos necesariamente de algo imposible. El Konjunktiv II sirve para &lt;b&gt;suavizar&lt;/b&gt; lo que pedimos, de modo que suene menos directo.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Regla habitual:&lt;/b&gt; verbo modal en Konjunktiv II + sujeto + complementos + infinitivo (si lo hay) al final.&lt;/p&gt;\n&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;Könnten Sie mir bitte helfen?&lt;/i&gt; — ¿Podría ayudarme, por favor?&lt;br&gt;&lt;i&gt;Würden Sie bitte das Fenster schließen?&lt;/i&gt; — ¿Tendría la amabilidad de cerrar la ventana?&lt;br&gt;&lt;i&gt;Dürfte ich eine Frage stellen?&lt;/i&gt; — ¿Me permitiría hacer una pregunta?&lt;/div&gt;\n&lt;p&gt;Compara: &lt;i&gt;Schließen Sie das Fenster!&lt;/i&gt; (¡Cierre la ventana!) / &lt;i&gt;Könnten Sie bitte das Fenster schließen?&lt;/i&gt; (¿Podría cerrar la ventana, por favor?).&lt;/p&gt;\n&lt;h3&gt;6. Consejos y recomendaciones (Ratschläge)&lt;/h3&gt;\n&lt;p&gt;Este uso, destacado también en la infografía que aportaste, permite &lt;b&gt;aconsejar sin dar una orden&lt;/b&gt;. Son frecuentes &lt;i&gt;an deiner Stelle würde ich …&lt;/i&gt; («yo, en tu lugar, …») y &lt;i&gt;du solltest …&lt;/i&gt; («deberías …»).&lt;/p&gt;\n&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;An deiner Stelle würde ich mehr Deutsch sprechen.&lt;/i&gt; — Yo, en tu lugar, hablaría más alemán.&lt;br&gt;&lt;i&gt;Du solltest jeden Tag ein bisschen üben.&lt;/i&gt; — Deberías practicar un poco todos los días.&lt;br&gt;&lt;i&gt;Ich würde dir empfehlen, früher anzufangen.&lt;/i&gt; — Te recomendaría empezar antes.&lt;/div&gt;\n&lt;p&gt;&lt;b&gt;Diferencia importante:&lt;/b&gt; &lt;i&gt;würde + infinitivo&lt;/i&gt; presenta lo que yo haría; &lt;i&gt;solltest + infinitivo&lt;/i&gt; expresa una recomendación dirigida a otra persona.&lt;/p&gt;\n&lt;h3&gt;7. Situaciones hipotéticas o improbables&lt;/h3&gt;\n&lt;p&gt;La infografía también destaca este uso general. No constituye por sí solo un tipo de subordinada: una hipótesis puede expresarse mediante una &lt;b&gt;oración condicional&lt;/b&gt; o una oración principal independiente.&lt;/p&gt;\n&lt;div class=\&quot;example-line\&quot;&gt;&lt;i&gt;Wenn ich reich wäre, würde ich die Welt bereisen.&lt;/i&gt; — Si fuera rico, viajaría por el mundo.&lt;br&gt;&lt;i&gt;Ich würde gern am Meer wohnen.&lt;/i&gt; — Me gustaría vivir junto al mar.&lt;/div&gt;\n&lt;h3&gt;Resumen para reconocer cada uso&lt;/h3&gt;\n&lt;table class=\&quot;passive-table\&quot;&gt;&lt;tr&gt;&lt;th&gt;¿Qué quiero expresar?&lt;/th&gt;&lt;th&gt;Señal habitual&lt;/th&gt;&lt;th&gt;Ejemplo breve&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Deseo irreal&lt;/td&gt;&lt;td&gt;wenn … doch / ¡!&lt;/td&gt;&lt;td&gt;Wenn ich doch Zeit hätte!&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Condición irreal&lt;/td&gt;&lt;td&gt;wenn …, würde …&lt;/td&gt;&lt;td&gt;Wenn ich Zeit hätte, käme ich.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Comparación irreal&lt;/td&gt;&lt;td&gt;als ob / als&lt;/td&gt;&lt;td&gt;Als ob er alles wüsste.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Consecuencia irreal&lt;/td&gt;&lt;td&gt;zu … als dass&lt;/td&gt;&lt;td&gt;Zu spät, als dass …&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Petición cortés&lt;/td&gt;&lt;td&gt;könnten / würden Sie&lt;/td&gt;&lt;td&gt;Könnten Sie helfen?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Consejo&lt;/td&gt;&lt;td&gt;solltest / an deiner Stelle&lt;/td&gt;&lt;td&gt;Du solltest üben.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;\n&lt;p&gt;&lt;small&gt;Referencia principal: Dreyer-Schmitt, §54, pp. 250–256 (numeración impresa). Los ejemplos de peticiones, consejos y situaciones hipotéticas también desarrollan los usos de la infografía proporcionada por el usuario.&lt;/small&gt;&lt;/p&gt;&quot;;const canvas=document.getElementById('canvas'),viewport=document.getElementById('viewport');let scale=1;
function apply(s){scale=s;canvas.style.zoom=String(s);document.getElementById('fit').classList.toggle('active',s!==1);document.getElementById('large').classList.toggle('active',s===1);document.getElementById('panbar').hidden=s!==1;requestAnimationFrame(updatePan)}
function updatePan(){const max=Math.max(0,viewport.scrollWidth-viewport.clientWidth);document.getElementById('panleft').disabled=viewport.scrollLeft&lt;=2;document.getElementById('panright').disabled=viewport.scrollLeft&gt;=max-2;}
document.getElementById('panleft').onclick=()=&gt;viewport.scrollBy({left:-Math.max(220,viewport.clientWidth*.65),behavior:'smooth'});
document.getElementById('panright').onclick=()=&gt;viewport.scrollBy({left:Math.max(220,viewport.clientWidth*.65),behavior:'smooth'});
viewport.addEventListener('scroll',updatePan,{passive:true});
let drag=null;
viewport.addEventListener('pointerdown',e=&gt;{if(scale!==1||e.pointerType!=='mouse'||e.button!==0||e.target.closest('button'))return;drag={x:e.clientX,left:viewport.scrollLeft};viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=&gt;{if(drag)viewport.scrollLeft=drag.left-(e.clientX-drag.x)});
function stopDrag(){drag=null;viewport.classList.remove('dragging')}
viewport.addEventListener('pointerup',stopDrag);viewport.addEventListener('pointercancel',stopDrag);
function fit(){apply(Math.min(1,(viewport.clientWidth-2)/1400));viewport.scrollLeft=0;viewport.scrollTop=0}

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main&gt;&lt;h1&gt;Tipos de verbos&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;Clasificación según la función que desempeñan en la oración&lt;/p&gt;&lt;section class=&quot;tree&quot; id=&quot;inicio&quot;&gt;&lt;button class=&quot;root&quot; id=&quot;raiz&quot;&gt;&lt;strong&gt;TIPOS DE VERBOS&lt;/strong&gt;&lt;small&gt;Un mismo verbo puede cumplir distintas funciones · Pulsa para saber más&lt;/small&gt;&lt;/button&gt;&lt;svg class=&quot;connector&quot; viewBox=&quot;0 0 1000 90&quot; preserveAspectRatio=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M500 0 V43 M125 43 H875 M125 43 V90 M375 43 V90 M625 43 V90 M875 43 V90&quot;/&gt;&lt;/svg&gt;&lt;div class=&quot;nodes&quot;&gt;&lt;button class=&quot;node&quot; data-key=&quot;voll&quot; aria-pressed=&quot;false&quot; style=&quot;--border:#2585b5;--dark:#12618d;--tint:#eaf7fc&quot;&gt;&lt;strong&gt;Vollverben&lt;/strong&gt;&lt;span class=&quot;hint&quot;&gt;Expresan una acción o estado&lt;/span&gt;&lt;em&gt;Ich schlafe.&lt;/em&gt;&lt;/button&gt;&lt;button class=&quot;node&quot; data-key=&quot;hilfs&quot; aria-pressed=&quot;false&quot; style=&quot;--border:#d79534;--dark:#8b5811;--tint:#fff7e8&quot;&gt;&lt;strong&gt;Hilfsverben&lt;/strong&gt;&lt;span class=&quot;hint&quot;&gt;Auxiliar + forma verbal&lt;/span&gt;&lt;em&gt;Ich habe gelernt.&lt;/em&gt;&lt;/button&gt;&lt;button class=&quot;node&quot; data-key=&quot;modal&quot; aria-pressed=&quot;false&quot; style=&quot;--border:#8a6dc5;--dark:#62469b;--tint:#f4efff&quot;&gt;&lt;strong&gt;Modalverben&lt;/strong&gt;&lt;span class=&quot;hint&quot;&gt;Modal + infinitivo&lt;/span&gt;&lt;em&gt;Ich muss lernen.&lt;/em&gt;&lt;/button&gt;&lt;button class=&quot;node&quot; data-key=&quot;kopula&quot; aria-pressed=&quot;false&quot; style=&quot;--border:#369a77;--dark:#197252;--tint:#e9f8f0&quot;&gt;&lt;strong&gt;Kopulaverben&lt;/strong&gt;&lt;span class=&quot;hint&quot;&gt;Sujeto + verbo + atributo&lt;/span&gt;&lt;em&gt;Ich werde müde.&lt;/em&gt;&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;p class=&quot;tip&quot;&gt;Pulsa el nodo central o cualquiera de las cuatro clases para ampliar la información debajo.&lt;/p&gt;&lt;section class=&quot;detail&quot; id=&quot;detalle&quot; aria-live=&quot;polite&quot;&gt;&lt;h2 id=&quot;titulo&quot;&gt;&lt;/h2&gt;&lt;div id=&quot;contenido&quot;&gt;&lt;/div&gt;&lt;button class=&quot;back&quot; id=&quot;volver&quot;&gt;↩ Regresar a la infografía&lt;/button&gt;&lt;/section&gt;&lt;/main&gt;&lt;script&gt;
const D={general:{title:'Tipos de verbos — visión general',body:`&lt;p&gt;Esta clasificación distingue los verbos por &lt;b&gt;la función que cumplen en una oración&lt;/b&gt;, no por su terminación o su conjugación.&lt;/p&gt;&lt;h3&gt;Cuatro funciones principales&lt;/h3&gt;&lt;p&gt;&lt;b&gt;Vollverben:&lt;/b&gt; aportan significado léxico. &lt;b&gt;Hilfsverben:&lt;/b&gt; construyen tiempos compuestos y la pasiva. &lt;b&gt;Modalverben:&lt;/b&gt; expresan capacidad, necesidad, permiso o voluntad. &lt;b&gt;Kopulaverben:&lt;/b&gt; relacionan el sujeto con una cualidad o identidad.&lt;/p&gt;&lt;h3&gt;Importante: las clases pueden coincidir&lt;/h3&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er wird müde.&lt;/b&gt; — Se está cansando. → &lt;i&gt;werden&lt;/i&gt; es copulativo.&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er wird lernen.&lt;/b&gt; — Estudiará. → &lt;i&gt;werden&lt;/i&gt; es auxiliar.&lt;/div&gt;&lt;p&gt;Por eso, para clasificar un verbo, observa &lt;b&gt;cómo se usa en esa oración&lt;/b&gt;.&lt;/p&gt;`},voll:{title:'Vollverben — verbos plenos',body:`&lt;h3&gt;¿Para qué se usan?&lt;/h3&gt;&lt;p&gt;Expresan por sí mismos una acción, un proceso o un estado. Son los verbos que aportan el significado principal de lo que ocurre.&lt;/p&gt;&lt;h3&gt;¿Cómo se reconocen?&lt;/h3&gt;&lt;p&gt;En una oración simple, el verbo pleno puede aparecer conjugado sin necesitar un auxiliar.&lt;/p&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich schlafe.&lt;/b&gt; — Duermo.&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Sie liest ein Buch.&lt;/b&gt; — Ella lee un libro.&lt;/div&gt;&lt;h3&gt;Relación con los auxiliares&lt;/h3&gt;&lt;p&gt;El mismo verbo pleno puede combinarse con &lt;i&gt;haben&lt;/i&gt; o &lt;i&gt;sein&lt;/i&gt; para formar el Perfekt.&lt;/p&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich habe geschlafen.&lt;/b&gt; — He dormido.&lt;/div&gt;`},hilfs:{title:'Hilfsverben — verbos auxiliares',body:`&lt;h3&gt;¿Cuáles son?&lt;/h3&gt;&lt;p&gt;&lt;b&gt;haben, sein y werden.&lt;/b&gt; Se utilizan para construir formas verbales junto con otro verbo.&lt;/p&gt;&lt;h3&gt;¿Cómo se forman las construcciones más frecuentes?&lt;/h3&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;haben + Partizip II:&lt;/b&gt; Ich &lt;b&gt;habe gelernt&lt;/b&gt;. — He estudiado. (Perfekt)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;sein + Partizip II:&lt;/b&gt; Er &lt;b&gt;ist gegangen&lt;/b&gt;. — Él se ha ido. (Perfekt)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;werden + infinitivo:&lt;/b&gt; Ich &lt;b&gt;werde lernen&lt;/b&gt;. — Estudiaré. (Futur I)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;werden + Partizip II:&lt;/b&gt; Das Haus &lt;b&gt;wird gebaut&lt;/b&gt;. — La casa es construida / está siendo construida. (Vorgangspassiv)&lt;/div&gt;&lt;h3&gt;Atención&lt;/h3&gt;&lt;p&gt;&lt;i&gt;haben, sein&lt;/i&gt; y &lt;i&gt;werden&lt;/i&gt; no son siempre auxiliares. Su función depende de la construcción: &lt;i&gt;Ich habe Zeit&lt;/i&gt;, &lt;i&gt;Ich bin müde&lt;/i&gt;, &lt;i&gt;Ich werde müde&lt;/i&gt;.&lt;/p&gt;`},modal:{title:'Modalverben — verbos modales',body:`&lt;h3&gt;¿Para qué se usan?&lt;/h3&gt;&lt;p&gt;Expresan capacidad, necesidad, permiso, obligación, intención o deseo respecto a una acción.&lt;/p&gt;&lt;h3&gt;¿Cómo se forman?&lt;/h3&gt;&lt;p&gt;Habitualmente, el modal se conjuga y el verbo principal va en &lt;b&gt;infinitivo al final&lt;/b&gt; de la oración.&lt;/p&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich kann schwimmen.&lt;/b&gt; — Sé nadar. (können)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich muss arbeiten.&lt;/b&gt; — Tengo que trabajar. (müssen)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Du darfst gehen.&lt;/b&gt; — Puedes irte; tienes permiso. (dürfen)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Du sollst warten.&lt;/b&gt; — Debes esperar; te lo han indicado. (sollen)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich will lernen.&lt;/b&gt; — Quiero aprender. (wollen)&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Ich mag Musik.&lt;/b&gt; — Me gusta la música. (mögen)&lt;/div&gt;&lt;p&gt;&lt;b&gt;möchten&lt;/b&gt; es una forma de Konjunktiv II de &lt;i&gt;mögen&lt;/i&gt;, muy utilizada para expresar deseos corteses: &lt;i&gt;Ich möchte einen Kaffee.&lt;/i&gt;&lt;/p&gt;`},kopula:{title:'Kopulaverben — verbos copulativos',body:`&lt;h3&gt;¿Para qué se usan?&lt;/h3&gt;&lt;p&gt;Relacionan al sujeto con una cualidad, un estado o una identidad. Los principales son &lt;b&gt;sein, werden y bleiben&lt;/b&gt;.&lt;/p&gt;&lt;h3&gt;¿Cómo se forman?&lt;/h3&gt;&lt;p&gt;&lt;b&gt;Sujeto + verbo copulativo + atributo&lt;/b&gt; (por ejemplo, un adjetivo o sustantivo).&lt;/p&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er ist müde.&lt;/b&gt; — Está cansado. → Estado.&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er wird müde.&lt;/b&gt; — Se está cansando. → Cambio de estado.&lt;/div&gt;&lt;div class=&quot;ex&quot;&gt;&lt;b&gt;Er bleibt müde.&lt;/b&gt; — Sigue cansado. → Continuidad.&lt;/div&gt;&lt;h3&gt;Una pista importante&lt;/h3&gt;&lt;p&gt;Con profesiones, &lt;i&gt;werden&lt;/i&gt; puede unir al sujeto con un sustantivo en nominativo: &lt;i&gt;Er wird Arzt.&lt;/i&gt; — Se hace médico.&lt;/p&gt;&lt;p&gt;&lt;i&gt;werden&lt;/i&gt; también puede funcionar como auxiliar de futuro o de pasiva. La estructura permite distinguirlo.&lt;/p&gt;`}};

cambio:{title:'Cambio de estado',rule:'werden + adjetivo o sustantivo',usage:'Expresa que alguien o algo pasa de un estado a otro. No significa «estar», sino «ponerse», «volverse» o «llegar a ser».',examples:[['Ich werde müde.','Me estoy cansando.'],['Es wird kalt.','Está empezando a hacer frío.'],['Sie wird Ärztin.','Ella se hará médica.']],note:'En Perfekt se usa &lt;strong&gt;geworden&lt;/strong&gt;: &lt;em&gt;Er ist müde geworden.&lt;/em&gt; (Se ha cansado).'},
futuro:{title:'Futuro con werden',rule:'werden (conjugado) + infinitivo al final',usage:'Permite hablar de hechos futuros, predicciones o suposiciones. En alemán también se utiliza mucho el Präsens para hablar del futuro.',examples:[['Ich werde morgen arbeiten.','Mañana trabajaré.'],['Er wird bald kommen.','Él vendrá pronto.'],['Sie wird schon zu Hause sein.','Probablemente ya estará en casa.']],note:'Futur II: &lt;strong&gt;werden + Partizip II + haben/sein&lt;/strong&gt;, por ejemplo: &lt;em&gt;Er wird angekommen sein.&lt;/em&gt; Puede expresar una suposición sobre un hecho ya terminado.'},
pasiva:{title:'Voz pasiva de proceso (Vorgangspassiv)',rule:'werden (conjugado) + Partizip II',usage:'El sujeto recibe la acción. La atención se centra en lo que ocurre, no necesariamente en quién lo hace.',examples:[['Das Haus wird gebaut.','La casa está siendo construida.'],['Das Haus wurde gebaut.','La casa fue construida.'],['Das Haus ist gebaut worden.','La casa ha sido construida.'],['Das Haus wird gebaut werden.','La casa será construida.']],note:'En el Perfekt pasivo se utiliza &lt;strong&gt;worden&lt;/strong&gt;, no &lt;em&gt;geworden&lt;/em&gt;: &lt;em&gt;ist gebaut worden&lt;/em&gt;. No confundir con la pasiva de estado: &lt;em&gt;Das Haus ist gebaut.&lt;/em&gt;'},
hipotesis:{title:'Konjunktiv II con würde',rule:'würde (conjugado) + infinitivo',usage:'Expresa situaciones hipotéticas, deseos o formulaciones corteses. &lt;em&gt;Würde&lt;/em&gt; es la forma de Konjunktiv II de &lt;em&gt;werden&lt;/em&gt;.',examples:[['Ich würde gern reisen.','Me gustaría viajar.'],['Wenn ich Zeit hätte, würde ich kommen.','Si tuviera tiempo, vendría.'],['Würdest du mir helfen?','¿Me ayudarías?']],note:'No todas las hipótesis requieren &lt;em&gt;würde&lt;/em&gt;: también son frecuentes formas como &lt;em&gt;hätte, wäre, könnte&lt;/em&gt;. Para hipótesis pasadas: &lt;em&gt;Ich hätte mehr gelernt.&lt;/em&gt;'}};
const panel=document.getElementById('details');document.querySelectorAll('.node').forEach(b=&gt;b.addEventListener('click',()=&gt;{document.querySelectorAll('.node').forEach(n=&gt;n.setAttribute('aria-pressed',String(n===b)));const d=info[b.dataset.key];panel.innerHTML=`&lt;h2&gt;${d.title}&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;¿Para qué se usa?&lt;/strong&gt; ${d.usage}&lt;/p&gt;&lt;h3&gt;Cómo se forma&lt;/h3&gt;&lt;div class=&quot;rule&quot;&gt;${d.rule}&lt;/div&gt;&lt;h3&gt;Ejemplos&lt;/h3&gt;${d.examples.map(e=&gt;`&lt;div class=&quot;ex&quot;&gt;&lt;strong&gt;${e[0]}&lt;/strong&gt;&lt;br&gt;&lt;em&gt;${e[1]}&lt;/em&gt;&lt;/div&gt;`).join('')}&lt;p class=&quot;note&quot;&gt;&lt;strong&gt;Importante:&lt;/strong&gt; ${d.note}&lt;/p&gt;&lt;button class=&quot;return&quot; id=&quot;back&quot;&gt;↑ Volver al mapa&lt;/button&gt;`;panel.classList.add('visible');document.getElementById('back').addEventListener('click',()=&gt;document.getElementById('diagram').scrollIntoView({behavior:'smooth',block:'start'}));panel.scrollIntoView({behavior:'smooth',block:'start'});}));
&lt;/script&gt;&lt;script&gt;(function(){
const btn=document.getElementById('werden-general');const panel=document.getElementById('details');
btn.setAttribute('aria-pressed','false');
btn.addEventListener('click',function(){
 document.querySelectorAll('.node').forEach(n=&gt;n.setAttribute('aria-pressed','false'));
 btn.setAttribute('aria-pressed','true');
 panel.innerHTML=`&lt;h2&gt;Werden — información general&lt;/h2&gt;
 &lt;p&gt;&lt;strong&gt;¿Qué clase de verbo es?&lt;/strong&gt; &lt;em&gt;Werden&lt;/em&gt; es irregular y puede actuar como &lt;strong&gt;verbo copulativo&lt;/strong&gt; (cambio de estado), como &lt;strong&gt;auxiliar&lt;/strong&gt; (futuro y pasiva) y, en su forma &lt;em&gt;würde&lt;/em&gt;, para construir expresiones habituales del &lt;strong&gt;Konjunktiv II&lt;/strong&gt;. Su función depende de la construcción.&lt;/p&gt;
 &lt;h3&gt;Conjugación básica&lt;/h3&gt;
 &lt;table class=&quot;conj&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Persona&lt;/th&gt;&lt;th&gt;Präsens&lt;/th&gt;&lt;th&gt;Präteritum&lt;/th&gt;&lt;th&gt;Konjunktiv II&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;ich&lt;/td&gt;&lt;td&gt;werde&lt;/td&gt;&lt;td&gt;wurde&lt;/td&gt;&lt;td&gt;würde&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;du&lt;/td&gt;&lt;td&gt;wirst&lt;/td&gt;&lt;td&gt;wurdest&lt;/td&gt;&lt;td&gt;würdest&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;er/sie/es&lt;/td&gt;&lt;td&gt;wird&lt;/td&gt;&lt;td&gt;wurde&lt;/td&gt;&lt;td&gt;würde&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;wir&lt;/td&gt;&lt;td&gt;werden&lt;/td&gt;&lt;td&gt;wurden&lt;/td&gt;&lt;td&gt;würden&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;ihr&lt;/td&gt;&lt;td&gt;werdet&lt;/td&gt;&lt;td&gt;wurdet&lt;/td&gt;&lt;td&gt;würdet&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;sie/Sie&lt;/td&gt;&lt;td&gt;werden&lt;/td&gt;&lt;td&gt;wurden&lt;/td&gt;&lt;td&gt;würden&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
 &lt;h3&gt;Konjunktiv I (discurso indirecto)&lt;/h3&gt;
 &lt;p&gt;&lt;strong&gt;ich werde · du werdest · er/sie/es werde · wir werden · ihr werdet · sie/Sie werden&lt;/strong&gt;.&lt;/p&gt;
 &lt;div class=&quot;ex&quot;&gt;&lt;strong&gt;Er sagt, er werde morgen kommen.&lt;/strong&gt;&lt;br&gt;&lt;em&gt;Dice que vendrá mañana (estilo indirecto).&lt;/em&gt;&lt;/div&gt;
 &lt;h3&gt;Formas que conviene distinguir&lt;/h3&gt;
 &lt;table class=&quot;conj&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Forma&lt;/th&gt;&lt;th&gt;Función&lt;/th&gt;&lt;th&gt;Ejemplo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;wird&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Präsens, 3.ª persona singular&lt;/td&gt;&lt;td&gt;Er wird müde.&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;wurde&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Präteritum&lt;/td&gt;&lt;td&gt;Das Haus wurde gebaut.&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;würde&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Konjunktiv II&lt;/td&gt;&lt;td&gt;Ich würde helfen.&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;geworden&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Partizip II: cambio de estado&lt;/td&gt;&lt;td&gt;Er ist müde geworden.&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;&lt;strong&gt;worden&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Participio usado en pasiva compuesta&lt;/td&gt;&lt;td&gt;Das Haus ist gebaut worden.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
 &lt;div class=&quot;general-tip&quot;&gt;&lt;strong&gt;Regla para reconocerlo:&lt;/strong&gt; adjetivo/sustantivo → cambio de estado; infinitivo → futuro; Partizip II → pasiva; &lt;em&gt;würde&lt;/em&gt; + infinitivo → hipótesis o cortesía. Son pistas útiles, no reglas mecánicas para todas las oraciones.&lt;/div&gt;
 &lt;h3&gt;Particularidades importantes&lt;/h3&gt;
 &lt;p&gt;Con un sustantivo como atributo, el verbo copulativo mantiene el &lt;strong&gt;nominativo&lt;/strong&gt;: &lt;em&gt;Er wird ein guter Lehrer.&lt;/em&gt; (Se convertirá en un buen profesor).&lt;/p&gt;
 &lt;p&gt;El &lt;strong&gt;Futur I&lt;/strong&gt; no es obligatorio para hablar del futuro: &lt;em&gt;Morgen arbeite ich.&lt;/em&gt; también expresa una acción futura.&lt;/p&gt;
 &lt;p&gt;En el &lt;strong&gt;Perfekt de cambio de estado&lt;/strong&gt; se usa &lt;em&gt;sein + geworden&lt;/em&gt;; en el &lt;strong&gt;Perfekt pasivo&lt;/strong&gt;, &lt;em&gt;sein + Partizip II + worden&lt;/em&gt;.&lt;/p&gt;
 &lt;button class=&quot;return&quot; id=&quot;back-general&quot;&gt;↑ Volver al mapa&lt;/button&gt;`;
 panel.classList.add('visible');
 panel.querySelector('#back-general').addEventListener('click',()=&gt;document.getElementById('diagram').scrollIntoView({behavior:'smooth',block:'start'}));
 panel.scrollIntoView({behavior:'smooth',block:'start'});
});
 document.querySelectorAll('.node').forEach(n=&gt;n.addEventListener('click',()=&gt;btn.setAttribute('aria-pressed','false')));
})();&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;" title="Werden"></iframe>
